<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Визуальный редактор схем залов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .toolbar {
            background: #2c3e50;
            color: white;
            padding: 10px 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .toolbar button {
            background: #3498db;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .toolbar button:hover {
            background: #2980b9;
        }

        .toolbar button.active {
            background: #e74c3c;
        }

        .toolbar select, .toolbar input[type="color"] {
            padding: 8px;
            border-radius: 4px;
            border: none;
            font-size: 14px;
        }

        .toolbar label {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background: white;
            border-right: 1px solid #ddd;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sidebar h3 {
            color: #2c3e50;
            font-size: 16px;
            margin-bottom: 10px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
        }

        .object-list {
            list-style: none;
            max-height: 300px;
            overflow-y: auto;
        }

        .object-list li {
            padding: 8px 12px;
            margin: 5px 0;
            background: #ecf0f1;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s;
        }

        .object-list li:hover {
            background: #bdc3c7;
        }

        .object-list li.selected {
            background: #3498db;
            color: white;
        }

        .object-list li button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }

        .properties-panel {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 5px;
        }

        .property-group {
            margin-bottom: 15px;
        }

        .property-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 13px;
        }

        .property-group input, .property-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .canvas-container {
            flex: 1;
            position: relative;
            overflow: auto;
            background: #fff;
        }

        #hallCanvas {
            display: block;
            cursor: crosshair;
        }

        .grid-toggle {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-delete {
            background: #e74c3c !important;
        }

        .btn-save {
            background: #27ae60 !important;
        }

        .btn-save:hover {
            background: #229954 !important;
        }

        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-bar {
            background: #34495e;
            color: white;
            padding: 5px 20px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <button id="btnSelect" class="active">🖱️ Выделение</button>
        <button id="btnTable">🪑 Стол</button>
        <button id="btnStage">🎭 Сцена</button>
        <button id="btnDanceFloor">💃 Танцпол</button>
        <button id="btnBar">🍸 Бар</button>
        <button id="btnCustom">◻️ Произвольный</button>
        
        <div style="flex: 1;"></div>
        
        <label class="grid-toggle">
            <input type="checkbox" id="chkGrid" checked> Сетка
        </label>
        
        <div class="zoom-controls">
            <button id="btnZoomOut">−</button>
            <span id="zoomLevel">100%</span>
            <button id="btnZoomIn">+</button>
        </div>
        
        <button class="btn-save" id="btnSave">💾 Сохранить</button>
        <button id="btnLoad">📂 Загрузить</button>
        <button class="btn-delete" id="btnClear">🗑️ Очистить</button>
        
        <input type="file" id="fileInput" accept=".json" style="display: none;">
    </div>

    <div class="main-container">
        <div class="sidebar">
            <div>
                <h3>Объекты на схеме</h3>
                <ul class="object-list" id="objectList"></ul>
            </div>

            <div class="properties-panel" id="propertiesPanel" style="display: none;">
                <h3>Свойства объекта</h3>
                
                <div class="property-group">
                    <label>Название</label>
                    <input type="text" id="propName" placeholder="Например: Стол 1">
                </div>

                <div class="property-group">
                    <label>Тип</label>
                    <select id="propType">
                        <option value="table">Стол</option>
                        <option value="stage">Сцена</option>
                        <option value="dancefloor">Танцпол</option>
                        <option value="bar">Бар</option>
                        <option value="custom">Произвольный</option>
                    </select>
                </div>

                <div class="property-group">
                    <label>Цвет фона</label>
                    <div class="color-picker-wrapper">
                        <input type="color" id="propColor" value="#3498db">
                    </div>
                </div>

                <div class="property-group">
                    <label>Прозрачность</label>
                    <input type="range" id="propOpacity" min="0.1" max="1" step="0.1" value="0.7">
                </div>

                <div class="property-group">
                    <label>X позиция</label>
                    <input type="number" id="propX" min="0">
                </div>

                <div class="property-group">
                    <label>Y позиция</label>
                    <input type="number" id="propY" min="0">
                </div>

                <div class="property-group">
                    <label>Ширина</label>
                    <input type="number" id="propWidth" min="10">
                </div>

                <div class="property-group">
                    <label>Высота</label>
                    <input type="number" id="propHeight" min="10">
                </div>

                <button class="btn-delete" id="btnDeleteObject" style="width: 100%; margin-top: 10px;">Удалить объект</button>
            </div>
        </div>

        <div class="canvas-container" id="canvasContainer">
            <canvas id="hallCanvas"></canvas>
        </div>
    </div>

    <div class="status-bar">
        <span id="statusInfo">Готов к работе</span>
        <span id="mousePos">X: 0, Y: 0</span>
    </div>

    <script>
        // Hall Editor Application
        class HallEditor {
            constructor() {
                this.canvas = document.getElementById('hallCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.container = document.getElementById('canvasContainer');
                
                this.objects = [];
                this.selectedObject = null;
                this.currentTool = 'select';
                this.isDragging = false;
                this.isResizing = false;
                this.dragOffset = { x: 0, y: 0 };
                this.resizeHandle = null;
                this.showGrid = true;
                this.zoom = 1;
                this.gridSize = 20;
                
                this.objectTypes = {
                    table: { name: 'Стол', icon: '🪑', defaultColor: '#3498db', defaultWidth: 80, defaultHeight: 80 },
                    stage: { name: 'Сцена', icon: '🎭', defaultColor: '#9b59b6', defaultWidth: 200, defaultHeight: 100 },
                    dancefloor: { name: 'Танцпол', icon: '💃', defaultColor: '#e74c3c', defaultWidth: 150, defaultHeight: 150 },
                    bar: { name: 'Бар', icon: '🍸', defaultColor: '#f39c12', defaultWidth: 120, defaultHeight: 60 },
                    custom: { name: 'Произвольный', icon: '◻️', defaultColor: '#2ecc71', defaultWidth: 100, defaultHeight: 100 }
                };

                this.resizeHandles = [
                    { name: 'nw', x: -5, y: -5, cursor: 'nw-resize' },
                    { name: 'n', x: 0, y: -5, cursor: 'n-resize' },
                    { name: 'ne', x: 5, y: -5, cursor: 'ne-resize' },
                    { name: 'e', x: 5, y: 0, cursor: 'e-resize' },
                    { name: 'se', x: 5, y: 5, cursor: 'se-resize' },
                    { name: 's', x: 0, y: 5, cursor: 's-resize' },
                    { name: 'sw', x: -5, y: 5, cursor: 'sw-resize' },
                    { name: 'w', x: -5, y: 0, cursor: 'w-resize' }
                ];

                this.init();
            }

            init() {
                this.resizeCanvas();
                this.bindEvents();
                this.render();
                this.updateObjectList();
            }

            resizeCanvas() {
                this.canvas.width = this.container.clientWidth;
                this.canvas.height = this.container.clientHeight;
                this.render();
            }

            bindEvents() {
                // Tool buttons
                document.getElementById('btnSelect').onclick = () => this.setTool('select');
                document.getElementById('btnTable').onclick = () => this.addObject('table');
                document.getElementById('btnStage').onclick = () => this.addObject('stage');
                document.getElementById('btnDanceFloor').onclick = () => this.addObject('dancefloor');
                document.getElementById('btnBar').onclick = () => this.addObject('bar');
                document.getElementById('btnCustom').onclick = () => this.addObject('custom');

                // Grid toggle
                document.getElementById('chkGrid').onchange = (e) => {
                    this.showGrid = e.target.checked;
                    this.render();
                };

                // Zoom controls
                document.getElementById('btnZoomIn').onclick = () => this.setZoom(this.zoom + 0.1);
                document.getElementById('btnZoomOut').onclick = () => this.setZoom(this.zoom - 0.1);

                // Save/Load/Clear
                document.getElementById('btnSave').onclick = () => this.saveSchema();
                document.getElementById('btnLoad').onclick = () => document.getElementById('fileInput').click();
                document.getElementById('fileInput').onchange = (e) => this.loadSchema(e);
                document.getElementById('btnClear').onclick = () => this.clearAll();

                // Canvas events
                this.canvas.onmousedown = (e) => this.onMouseDown(e);
                this.canvas.onmousemove = (e) => this.onMouseMove(e);
                this.canvas.onmouseup = () => this.onMouseUp();
                this.canvas.onmouseleave = () => this.onMouseUp();

                // Properties panel
                document.getElementById('propName').oninput = () => this.updateSelectedObject();
                document.getElementById('propType').onchange = () => this.updateSelectedObject();
                document.getElementById('propColor').oninput = () => this.updateSelectedObject();
                document.getElementById('propOpacity').oninput = () => this.updateSelectedObject();
                document.getElementById('propX').oninput = () => this.updateSelectedObject();
                document.getElementById('propY').oninput = () => this.updateSelectedObject();
                document.getElementById('propWidth').oninput = () => this.updateSelectedObject();
                document.getElementById('propHeight').oninput = () => this.updateSelectedObject();
                document.getElementById('btnDeleteObject').onclick = () => this.deleteSelectedObject();

                // Window resize
                window.onresize = () => this.resizeCanvas();
            }

            setTool(tool) {
                this.currentTool = tool;
                document.querySelectorAll('.toolbar button').forEach(btn => btn.classList.remove('active'));
                document.getElementById('btn' + tool.charAt(0).toUpperCase() + tool.slice(1)).classList.add('active');
                this.setStatus(`Инструмент: ${this.getToolName(tool)}`);
            }

            getToolName(tool) {
                const names = {
                    select: 'Выделение',
                    table: 'Стол',
                    stage: 'Сцена',
                    dancefloor: 'Танцпол',
                    bar: 'Бар',
                    custom: 'Произвольный'
                };
                return names[tool] || tool;
            }

            addObject(type) {
                const objType = this.objectTypes[type];
                const newObj = {
                    id: Date.now(),
                    type: type,
                    name: `${objType.name} ${this.objects.filter(o => o.type === type).length + 1}`,
                    x: Math.round((this.canvas.width / 2 - objType.defaultWidth / 2) / this.gridSize) * this.gridSize,
                    y: Math.round((this.canvas.height / 2 - objType.defaultHeight / 2) / this.gridSize) * this.gridSize,
                    width: objType.defaultWidth,
                    height: objType.defaultHeight,
                    color: objType.defaultColor,
                    opacity: 0.7
                };

                this.objects.push(newObj);
                this.selectObject(newObj);
                this.updateObjectList();
                this.render();
                this.setStatus(`Добавлен: ${objType.name}`);
                this.setTool('select');
            }

            selectObject(obj) {
                this.selectedObject = obj;
                this.updatePropertiesPanel();
                this.updateObjectList();
                this.render();
            }

            updatePropertiesPanel() {
                const panel = document.getElementById('propertiesPanel');
                if (this.selectedObject) {
                    panel.style.display = 'block';
                    document.getElementById('propName').value = this.selectedObject.name;
                    document.getElementById('propType').value = this.selectedObject.type;
                    document.getElementById('propColor').value = this.selectedObject.color;
                    document.getElementById('propOpacity').value = this.selectedObject.opacity;
                    document.getElementById('propX').value = Math.round(this.selectedObject.x);
                    document.getElementById('propY').value = Math.round(this.selectedObject.y);
                    document.getElementById('propWidth').value = Math.round(this.selectedObject.width);
                    document.getElementById('propHeight').value = Math.round(this.selectedObject.height);
                } else {
                    panel.style.display = 'none';
                }
            }

            updateSelectedObject() {
                if (!this.selectedObject) return;

                this.selectedObject.name = document.getElementById('propName').value;
                this.selectedObject.type = document.getElementById('propType').value;
                this.selectedObject.color = document.getElementById('propColor').value;
                this.selectedObject.opacity = parseFloat(document.getElementById('propOpacity').value);
                this.selectedObject.x = parseFloat(document.getElementById('propX').value);
                this.selectedObject.y = parseFloat(document.getElementById('propY').value);
                this.selectedObject.width = parseFloat(document.getElementById('propWidth').value);
                this.selectedObject.height = parseFloat(document.getElementById('propHeight').value);

                this.updateObjectList();
                this.render();
            }

            deleteSelectedObject() {
                if (!this.selectedObject) return;
                const index = this.objects.indexOf(this.selectedObject);
                if (index > -1) {
                    this.objects.splice(index, 1);
                    this.selectedObject = null;
                    this.updatePropertiesPanel();
                    this.updateObjectList();
                    this.render();
                    this.setStatus('Объект удалён');
                }
            }

            updateObjectList() {
                const list = document.getElementById('objectList');
                list.innerHTML = '';

                this.objects.forEach((obj, index) => {
                    const li = document.createElement('li');
                    const objType = this.objectTypes[obj.type];
                    li.innerHTML = `
                        <span>${objType.icon} ${obj.name}</span>
                        <button onclick="editor.selectObjectByIndex(${index})">✏️</button>
                    `;
                    
                    if (this.selectedObject && this.selectedObject.id === obj.id) {
                        li.classList.add('selected');
                    }

                    li.onclick = (e) => {
                        if (e.target.tagName !== 'BUTTON') {
                            this.selectObject(obj);
                        }
                    };

                    list.appendChild(li);
                });
            }

            selectObjectByIndex(index) {
                this.selectObject(this.objects[index]);
            }

            onMouseDown(e) {
                const rect = this.canvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) / this.zoom;
                const y = (e.clientY - rect.top) / this.zoom;

                if (this.currentTool === 'select') {
                    // Check resize handles first
                    if (this.selectedObject) {
                        const handle = this.getResizeHandleAt(x, y, this.selectedObject);
                        if (handle) {
                            this.isResizing = true;
                            this.resizeHandle = handle;
                            return;
                        }
                    }

                    // Check objects
                    for (let i = this.objects.length - 1; i >= 0; i--) {
                        const obj = this.objects[i];
                        if (x >= obj.x && x <= obj.x + obj.width &&
                            y >= obj.y && y <= obj.y + obj.height) {
                            this.selectObject(obj);
                            this.isDragging = true;
                            this.dragOffset = { x: x - obj.x, y: y - obj.y };
                            return;
                        }
                    }

                    // Clicked on empty space
                    this.selectObject(null);
                }
            }

            onMouseMove(e) {
                const rect = this.canvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) / this.zoom;
                const y = (e.clientY - rect.top) / this.zoom;

                document.getElementById('mousePos').textContent = `X: ${Math.round(x)}, Y: ${Math.round(y)}`;

                if (this.isDragging && this.selectedObject) {
                    this.selectedObject.x = Math.round((x - this.dragOffset.x) / this.gridSize) * this.gridSize;
                    this.selectedObject.y = Math.round((y - this.dragOffset.y) / this.gridSize) * this.gridSize;
                    this.updatePropertiesPanel();
                    this.render();
                } else if (this.isResizing && this.selectedObject && this.resizeHandle) {
                    this.resizeObject(x, y);
                } else if (this.currentTool === 'select') {
                    // Update cursor
                    if (this.selectedObject) {
                        const handle = this.getResizeHandleAt(x, y, this.selectedObject);
                        if (handle) {
                            this.canvas.style.cursor = handle.cursor;
                        } else if (x >= this.selectedObject.x && x <= this.selectedObject.x + this.selectedObject.width &&
                                   y >= this.selectedObject.y && y <= this.selectedObject.y + this.selectedObject.height) {
                            this.canvas.style.cursor = 'move';
                        } else {
                            this.canvas.style.cursor = 'default';
                        }
                    } else {
                        this.canvas.style.cursor = 'default';
                    }
                }
            }

            onMouseUp() {
                this.isDragging = false;
                this.isResizing = false;
                this.resizeHandle = null;
            }

            resizeObject(x, y) {
                const obj = this.selectedObject;
                const handle = this.resizeHandle;
                const minSize = 20;

                switch (handle.name) {
                    case 'se':
                        obj.width = Math.max(minSize, Math.round((x - obj.x) / this.gridSize) * this.gridSize);
                        obj.height = Math.max(minSize, Math.round((y - obj.y) / this.gridSize) * this.gridSize);
                        break;
                    case 'sw':
                        const newWidthSW = obj.width + obj.x - x;
                        if (newWidthSW >= minSize) {
                            obj.x = Math.round(x / this.gridSize) * this.gridSize;
                            obj.width = Math.round(newWidthSW / this.gridSize) * this.gridSize;
                        }
                        obj.height = Math.max(minSize, Math.round((y - obj.y) / this.gridSize) * this.gridSize);
                        break;
                    case 'ne':
                        obj.width = Math.max(minSize, Math.round((x - obj.x) / this.gridSize) * this.gridSize);
                        const newHeightNE = obj.height + obj.y - y;
                        if (newHeightNE >= minSize) {
                            obj.y = Math.round(y / this.gridSize) * this.gridSize;
                            obj.height = Math.round(newHeightNE / this.gridSize) * this.gridSize;
                        }
                        break;
                    case 'nw':
                        const newWidthNW = obj.width + obj.x - x;
                        const newHeightNW = obj.height + obj.y - y;
                        if (newWidthNW >= minSize) {
                            obj.x = Math.round(x / this.gridSize) * this.gridSize;
                            obj.width = Math.round(newWidthNW / this.gridSize) * this.gridSize;
                        }
                        if (newHeightNW >= minSize) {
                            obj.y = Math.round(y / this.gridSize) * this.gridSize;
                            obj.height = Math.round(newHeightNW / this.gridSize) * this.gridSize;
                        }
                        break;
                    case 'e':
                        obj.width = Math.max(minSize, Math.round((x - obj.x) / this.gridSize) * this.gridSize);
                        break;
                    case 'w':
                        const newWidthW = obj.width + obj.x - x;
                        if (newWidthW >= minSize) {
                            obj.x = Math.round(x / this.gridSize) * this.gridSize;
                            obj.width = Math.round(newWidthW / this.gridSize) * this.gridSize;
                        }
                        break;
                    case 's':
                        obj.height = Math.max(minSize, Math.round((y - obj.y) / this.gridSize) * this.gridSize);
                        break;
                    case 'n':
                        const newHeightN = obj.height + obj.y - y;
                        if (newHeightN >= minSize) {
                            obj.y = Math.round(y / this.gridSize) * this.gridSize;
                            obj.height = Math.round(newHeightN / this.gridSize) * this.gridSize;
                        }
                        break;
                }

                this.updatePropertiesPanel();
                this.render();
            }

            getResizeHandleAt(x, y, obj) {
                const handleSize = 10;
                const margin = 5;

                for (const handle of this.resizeHandles) {
                    let hx, hy;

                    switch (handle.name) {
                        case 'nw': hx = obj.x - margin; hy = obj.y - margin; break;
                        case 'n': hx = obj.x + obj.width / 2; hy = obj.y - margin; break;
                        case 'ne': hx = obj.x + obj.width + margin; hy = obj.y - margin; break;
                        case 'e': hx = obj.x + obj.width + margin; hy = obj.y + obj.height / 2; break;
                        case 'se': hx = obj.x + obj.width + margin; hy = obj.y + obj.height + margin; break;
                        case 's': hx = obj.x + obj.width / 2; hy = obj.y + obj.height + margin; break;
                        case 'sw': hx = obj.x - margin; hy = obj.y + obj.height + margin; break;
                        case 'w': hx = obj.x - margin; hy = obj.y + obj.height / 2; break;
                    }

                    if (x >= hx - handleSize && x <= hx + handleSize &&
                        y >= hy - handleSize && y <= hy + handleSize) {
                        return handle;
                    }
                }

                return null;
            }

            setZoom(level) {
                this.zoom = Math.max(0.5, Math.min(2, level));
                document.getElementById('zoomLevel').textContent = Math.round(this.zoom * 100) + '%';
                this.render();
            }

            render() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                this.ctx.save();
                this.ctx.scale(this.zoom, this.zoom);

                // Draw grid
                if (this.showGrid) {
                    this.drawGrid();
                }

                // Draw objects
                this.objects.forEach(obj => this.drawObject(obj));

                // Draw selection and resize handles
                if (this.selectedObject) {
                    this.drawSelection(this.selectedObject);
                    this.drawResizeHandles(this.selectedObject);
                }

                this.ctx.restore();
            }

            drawGrid() {
                this.ctx.strokeStyle = '#e0e0e0';
                this.ctx.lineWidth = 1;

                for (let x = 0; x < this.canvas.width / this.zoom; x += this.gridSize) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, 0);
                    this.ctx.lineTo(x, this.canvas.height / this.zoom);
                    this.ctx.stroke();
                }

                for (let y = 0; y < this.canvas.height / this.zoom; y += this.gridSize) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, y);
                    this.ctx.lineTo(this.canvas.width / this.zoom, y);
                    this.ctx.stroke();
                }
            }

            drawObject(obj) {
                const objType = this.objectTypes[obj.type];

                // Fill
                this.ctx.fillStyle = obj.color;
                this.ctx.globalAlpha = obj.opacity;
                this.ctx.fillRect(obj.x, obj.y, obj.width, obj.height);

                // Border
                this.ctx.globalAlpha = 1;
                this.ctx.strokeStyle = '#2c3e50';
                this.ctx.lineWidth = 2;
                this.ctx.strokeRect(obj.x, obj.y, obj.width, obj.height);

                // Label
                this.ctx.fillStyle = '#fff';
                this.ctx.font = 'bold 14px Segoe UI';
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';
                this.ctx.shadowColor = 'rgba(0,0,0,0.5)';
                this.ctx.shadowBlur = 3;
                this.ctx.fillText(`${objType.icon} ${obj.name}`, obj.x + obj.width / 2, obj.y + obj.height / 2);
                this.ctx.shadowBlur = 0;
            }

            drawSelection(obj) {
                this.ctx.strokeStyle = '#e74c3c';
                this.ctx.lineWidth = 3;
                this.ctx.setLineDash([5, 5]);
                this.ctx.strokeRect(obj.x - 5, obj.y - 5, obj.width + 10, obj.height + 10);
                this.ctx.setLineDash([]);
            }

            drawResizeHandles(obj) {
                this.ctx.fillStyle = '#e74c3c';
                
                this.resizeHandles.forEach(handle => {
                    let hx, hy;

                    switch (handle.name) {
                        case 'nw': hx = obj.x - 5; hy = obj.y - 5; break;
                        case 'n': hx = obj.x + obj.width / 2; hy = obj.y - 5; break;
                        case 'ne': hx = obj.x + obj.width + 5; hy = obj.y - 5; break;
                        case 'e': hx = obj.x + obj.width + 5; hy = obj.y + obj.height / 2; break;
                        case 'se': hx = obj.x + obj.width + 5; hy = obj.y + obj.height + 5; break;
                        case 's': hx = obj.x + obj.width / 2; hy = obj.y + obj.height + 5; break;
                        case 'sw': hx = obj.x - 5; hy = obj.y + obj.height + 5; break;
                        case 'w': hx = obj.x - 5; hy = obj.y + obj.height / 2; break;
                    }

                    this.ctx.beginPath();
                    this.ctx.arc(hx, hy, 6, 0, Math.PI * 2);
                    this.ctx.fill();
                });
            }

            saveSchema() {
                const schema = {
                    version: '1.0',
                    createdAt: new Date().toISOString(),
                    objects: this.objects
                };

                const dataStr = JSON.stringify(schema, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                
                const link = document.createElement('a');
                link.href = url;
                link.download = `hall-schema-${Date.now()}.json`;
                link.click();
                
                URL.revokeObjectURL(url);
                this.setStatus('Схема сохранена');
            }

            loadSchema(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const schema = JSON.parse(event.target.result);
                        if (schema.objects && Array.isArray(schema.objects)) {
                            this.objects = schema.objects;
                            this.selectedObject = null;
                            this.updatePropertiesPanel();
                            this.updateObjectList();
                            this.render();
                            this.setStatus(`Схема загружена: ${this.objects.length} объектов`);
                        } else {
                            alert('Неверный формат файла');
                        }
                    } catch (err) {
                        alert('Ошибка при загрузке файла: ' + err.message);
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            }

            clearAll() {
                if (confirm('Вы уверены, что хотите очистить всю схему?')) {
                    this.objects = [];
                    this.selectedObject = null;
                    this.updatePropertiesPanel();
                    this.updateObjectList();
                    this.render();
                    this.setStatus('Схема очищена');
                }
            }

            setStatus(message) {
                document.getElementById('statusInfo').textContent = message;
            }
        }

        // Initialize editor
        const editor = new HallEditor();
    </script>
</body>
</html>
