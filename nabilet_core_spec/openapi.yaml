openapi: 3.1.0
info:
  title: NABILET Core API
  version: 1.0.0
  description: |
    REST API v1 for NABILET Core ticketing platform.
    Public catalog, checkout, customer account, admin, checker, embed and integration endpoints.
servers:
  - url: https://example.com
    description: Production
  - url: https://staging.example.com
    description: Staging

tags:
  - name: Auth
  - name: Catalog
  - name: Sessions
  - name: Cart
  - name: Orders
  - name: Payments
  - name: Tickets
  - name: Checkin
  - name: Me
  - name: Admin Events
  - name: Admin Venues
  - name: Admin Orders
  - name: Admin Tickets
  - name: Admin Checkin
  - name: Admin Analytics
  - name: Webhooks
  - name: Embed
  - name: Telegram
  - name: System
  - name: Promo Codes
  - name: Media
  - name: Translations
  - name: Admin Users

paths:
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register customer
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login by email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout current session
      operationId: logout
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/password/forgot:
    post:
      tags: [Auth]
      summary: Request password reset
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '204': { description: Request accepted }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/auth/password/reset:
    post:
      tags: [Auth]
      summary: Reset password
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 12 }
                password_confirmation: { type: string }
      responses:
        '204': { description: Password reset }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/auth/email/verify:
    post:
      tags: [Auth]
      summary: Verify email
      operationId: verifyEmail
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '204': { description: Email verified }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/yandex/callback:
    get:
      tags: [Auth]
      summary: Yandex OAuth callback
      operationId: yandexCallback
      parameters:
        - $ref: '#/components/parameters/OAuthCode'
        - $ref: '#/components/parameters/OAuthState'
      responses:
        '302': { description: Redirect to application }

  /auth/vk/callback:
    get:
      tags: [Auth]
      summary: VK OAuth callback
      operationId: vkCallback
      parameters:
        - $ref: '#/components/parameters/OAuthCode'
        - $ref: '#/components/parameters/OAuthState'
      responses:
        '302': { description: Redirect to application }

  /api/v1/events:
    get:
      tags: [Catalog]
      summary: List public events
      operationId: listEvents
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: date_from
          schema: { type: string, format: date }
        - in: query
          name: date_to
          schema: { type: string, format: date }
        - in: query
          name: price_from
          schema: { type: integer, minimum: 0 }
        - in: query
          name: price_to
          schema: { type: integer, minimum: 0 }
        - in: query
          name: availability
          schema: { type: string, enum: [any, available, sold_out] }
      responses:
        '200':
          description: Event list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventListResponse' }

  /api/v1/events/{event}:
    get:
      tags: [Catalog]
      summary: Get public event
      operationId: getEvent
      parameters:
        - $ref: '#/components/parameters/EventIdPath'
      responses:
        '200':
          description: Event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/events/{event}/sessions:
    get:
      tags: [Sessions]
      summary: List sessions of event
      operationId: listEventSessions
      parameters:
        - $ref: '#/components/parameters/EventIdPath'
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Session list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionListResponse' }

  /api/v1/sessions/{session}:
    get:
      tags: [Sessions]
      summary: Get session
      operationId: getSession
      parameters:
        - $ref: '#/components/parameters/SessionIdPath'
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/sessions/{session}/seatmap:
    get:
      tags: [Sessions]
      summary: Get seat map and inventory
      operationId: getSeatMap
      parameters:
        - $ref: '#/components/parameters/SessionIdPath'
      responses:
        '200':
          description: Seat map
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatMapResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/carts:
    post:
      tags: [Cart]
      summary: Create cart
      operationId: createCart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id]
              properties:
                session_id: { type: string }
      responses:
        '201':
          description: Cart created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/carts/{cart}:
    get:
      tags: [Cart]
      summary: Get cart
      operationId: getCart
      security:
        - bearerAuth: []
        - checkoutAuth: []
      parameters:
        - $ref: '#/components/parameters/CartIdPath'
      responses:
        '200':
          description: Cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/carts/{cart}/items:
    post:
      tags: [Cart]
      summary: Hold inventory and add item to cart
      operationId: addCartItem
      security:
        - bearerAuth: []
        - checkoutAuth: []
      parameters:
        - $ref: '#/components/parameters/CartIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
      responses:
        '201':
          description: Hold created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '409':
          description: Inventory conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/carts/{cart}/items/{item}:
    delete:
      tags: [Cart]
      summary: Release cart item/hold
      operationId: deleteCartItem
      security:
        - bearerAuth: []
        - checkoutAuth: []
      parameters:
        - $ref: '#/components/parameters/CartIdPath'
        - $ref: '#/components/parameters/CartItemIdPath'
      responses:
        '204': { description: Released }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/orders:
    post:
      tags: [Orders]
      summary: Create order from cart
      operationId: createOrder
      security:
        - bearerAuth: []
        - checkoutAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '409':
          description: Hold expired or inventory changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/orders/{order}:
    get:
      tags: [Orders]
      summary: Get order
      operationId: getOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
      responses:
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/orders/{order}/payment:
    post:
      tags: [Payments]
      summary: Create payment for order
      operationId: createOrderPayment
      security:
        - bearerAuth: []
        - checkoutAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                provider:
                  type: string
                  default: yookassa
      responses:
        '201':
          description: Payment created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentResponse' }
        '409':
          description: Order not payable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/payments/{payment}:
    get:
      tags: [Payments]
      summary: Get payment
      operationId: getPayment
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PaymentIdPath'
      responses:
        '200':
          description: Payment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/tickets:
    get:
      tags: [Tickets]
      summary: List customer tickets
      operationId: listMyTickets
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - in: query
          name: status
          schema: { type: string }
      responses:
        '200':
          description: Tickets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketListResponse' }

  /api/v1/tickets/{ticket}:
    get:
      tags: [Tickets]
      summary: Get customer ticket
      operationId: getTicket
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TicketIdPath'
      responses:
        '200':
          description: Ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/tickets/{ticket}/qr:
    get:
      tags: [Tickets]
      summary: Get ticket QR payload/image
      description: >-
        Returns an opaque, signed token. The payload MUST NOT contain personal
        data (spec 43/44): no holder name, email, phone or seat owner. Verification
        happens server-side against the signature, never by reading the token.
      operationId: getTicketQr
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TicketIdPath'
      responses:
        '200':
          description: QR payload
          content:
            application/json:
              schema:
                type: object
                description: Opaque signed token. Carries no personal data (spec 43/44).
                required: [payload, version]
                properties:
                  payload: { type: string, description: Signed opaque token. No personal data. }
                  version: { type: integer }

  /api/v1/tickets/{ticket}/pdf:
    get:
      tags: [Tickets]
      summary: Download ticket PDF
      operationId: getTicketPdf
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TicketIdPath'
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '202':
          description: PDF generation queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AsyncJobResponse' }

  /api/v1/me:
    get:
      tags: [Me]
      summary: Get profile
      operationId: getMe
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
    patch:
      tags: [Me]
      summary: Update profile
      operationId: updateMe
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/me/password:
    post:
      tags: [Me]
      summary: Change password
      operationId: changePassword
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string }
                password: { type: string, minLength: 12 }
                password_confirmation: { type: string }
      responses:
        '204': { description: Password changed }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/me/sessions:
    get:
      tags: [Me]
      summary: List login sessions
      operationId: listSessions
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/UserSession' }

  /api/v1/me/sessions/{session}:
    delete:
      tags: [Me]
      summary: Revoke one session
      operationId: revokeSession
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UserSessionIdPath'
      responses:
        '204': { description: Session revoked }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/me/orders:
    get:
      tags: [Me]
      summary: List my orders
      operationId: listMyOrders
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderListResponse' }

  /api/v1/checkin/validate:
    post:
      tags: [Checkin]
      summary: Validate QR ticket without consuming it
      operationId: validateCheckin
      security: [{ checkerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckinValidateRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckinResultResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/v1/checkin/use:
    post:
      tags: [Checkin]
      summary: Atomically consume ticket
      operationId: useCheckin
      security: [{ checkerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckinUseRequest'
      responses:
        '200':
          description: Check-in result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckinResultResponse' }
        '409':
          description: Already used/conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckinResultResponse' }

  /api/v1/checkin/sync:
    post:
      tags: [Checkin]
      summary: Sync offline scans
      operationId: syncCheckin
      security: [{ checkerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckinSyncRequest'
      responses:
        '200':
          description: Sync result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckinSyncResponse' }

  /api/v1/admin/events:
    get:
      tags: [Admin Events]
      summary: List events for admin
      operationId: adminListEvents
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: organization_id
          schema: { type: string }
      responses:
        '200':
          description: Admin event list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin Events]
      summary: Create event
      operationId: adminCreateEvent
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventWriteRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/admin/events/{event}:
    get:
      tags: [Admin Events]
      summary: Get event in admin
      operationId: adminGetEvent
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/EventIdPath'
      responses:
        '200':
          description: Event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Admin Events]
      summary: Update event
      operationId: adminUpdateEvent
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/EventIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventWriteRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Admin Events]
      summary: Delete/archive event
      operationId: adminDeleteEvent
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/EventIdPath'
      responses:
        '204': { description: Archived/deleted }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/admin/sessions:
    post:
      tags: [Admin Events]
      summary: Create session
      operationId: adminCreateSession
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionWriteRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/admin/sessions/{session}:
    patch:
      tags: [Admin Events]
      summary: Update session
      operationId: adminUpdateSession
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/SessionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionWriteRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }

  /api/v1/admin/venues:
    get:
      tags: [Admin Venues]
      summary: List venues
      operationId: adminListVenues
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Venues
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueListResponse' }
    post:
      tags: [Admin Venues]
      summary: Create venue
      operationId: adminCreateVenue
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VenueWriteRequest' }
      responses:
        '201':
          description: Venue created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueResponse' }

  /api/v1/admin/venues/{venue}/halls:
    post:
      tags: [Admin Venues]
      summary: Create hall
      operationId: adminCreateHall
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/VenueIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HallWriteRequest' }
      responses:
        '201':
          description: Hall created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HallResponse' }

  /api/v1/admin/halls/{hall}/schema-versions:
    get:
      tags: [Admin Venues]
      summary: List schema versions
      operationId: adminListSchemaVersions
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/HallIdPath'
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/HallSchemaVersion' }
    post:
      tags: [Admin Venues]
      summary: Create schema version
      operationId: adminCreateSchemaVersion
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/HallIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HallSchemaWriteRequest' }
      responses:
        '201':
          description: Schema draft
          content:
            application/json:
