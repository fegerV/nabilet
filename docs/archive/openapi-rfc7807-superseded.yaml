openapi: 3.1.0

info:
  title: NABILET Core API
  version: 1.0.0
  description: |
    REST API ядра системы продажи билетов.

    ## Общие правила

    **Версионирование.** Префикс `/api/v1`. Обратно несовместимые изменения — только в `/api/v2`.

    **Ошибки.** Все ответы об ошибках — `application/problem+json` (RFC 7807) со
    стабильным `title`, содержащим машиночитаемый код (`SEAT_UNAVAILABLE`,
    `HOLD_EXPIRED`). Клиенты ветвятся **по коду, а не по тексту**: сообщения
    локализуются и могут меняться.

    **Идемпотентность.** Изменяющие эндпоинты принимают заголовок
    `Idempotency-Key`. Первый запрос выполняется, ответ запоминается; повтор с тем же
    ключом и тем же телом возвращает запомненный ответ (заголовок
    `Idempotent-Replay: true`). Повтор с тем же ключом и **другим** телом отклоняется
    с `IDEMPOTENCY_KEY_REUSED`. Это обязательно для мобильных клиентов, которые
    повторяют POST при обрыве сети.

    **Мультитенантность.** Все данные ограничены организацией аутентифицированного
    пользователя. Запрос чужого объекта возвращает **404, а не 403** — код 403
    подтвердил бы существование объекта в другой организации.

    **Деньги.** Все суммы — целые числа в minor units (копейки) плюс код валюты.
    Поле `decimal` присутствует для отображения, но вычислять по нему нельзя.

    **Пагинация.** Cursor-based: `?cursor=&limit=`. `limit` по умолчанию 25,
    максимум 100.

  contact:
    name: NABILET Core
    url: https://nabilet.ru

servers:
  - url: https://tickets.example.com/api/v1
    description: Production
  - url: http://localhost:8000/api/v1
    description: Локальная разработка

tags:
  - name: Catalog
    description: Публичный каталог мероприятий
  - name: Seats
    description: Схема зала и выбор мест
  - name: Cart
    description: Корзина и бронирование
  - name: Orders
    description: Заказы
  - name: Payments
    description: Платежи и вебхуки провайдеров
  - name: Tickets
    description: Билеты
  - name: Check-in
    description: Валидация билетов на входе
  - name: Embed
    description: API для встраивания в чужие сайты
  - name: Users
    description: Профиль и сессии

security:
  - bearerAuth: []

paths:
  # ─────────────────────────────────────────────────────────────── Catalog ──
  /events:
    get:
      tags: [Catalog]
      summary: Список мероприятий
      description: |
        Возвращает только мероприятия в статусах `published` и `completed`.
        Черновики исключены по построению — тот же список используется для sitemap.
      security: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: category
          in: query
          schema: { type: string }
          description: Slug категории
        - name: city
          in: query
          schema: { type: string }
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
        - name: price_min
          in: query
          schema: { type: integer, minimum: 0 }
          description: В minor units
        - name: price_max
          in: query
          schema: { type: integer, minimum: 0 }
        - name: q
          in: query
          schema: { type: string }
          description: Полнотекстовый поиск
        - name: sort
          in: query
          schema:
            type: string
            enum: [date_asc, date_desc, price_asc, price_desc, popular]
            default: date_asc
        - name: locale
          in: query
          schema: { type: string, default: ru }
      responses:
        '200':
          description: Список мероприятий
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/EventSummary' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /events/{slug}:
    get:
      tags: [Catalog]
      summary: Мероприятие по slug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: locale
          in: query
          schema: { type: string, default: ru }
      responses:
        '200':
          description: Мероприятие с сеансами
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/EventDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /events/{slug}/sessions/{sessionId}:
    get:
      tags: [Catalog]
      summary: Сеанс с доступностью
      description: |
        `available_count` вычисляется по inventory_items и **никогда не кэшируется**
        (ТЗ §59): устаревшие данные о наличии продают одно место дважды.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: sessionId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Сеанс
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SessionDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────────────────────────────────────────────── Seats ──
  /sessions/{sessionId}/seatmap:
    get:
      tags: [Seats]
      summary: Схема зала для сеанса
      description: |
        Возвращает геометрию **неизменяемой версии схемы**, на которую ссылается
        сеанс, вместе с текущими статусами мест. Геометрия безопасна для кэширования
        (она неизменяема); статусы — нет.
      security: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Схема зала
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeatMap' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sessions/{sessionId}/holds:
    post:
      tags: [Seats]
      summary: Забронировать места (временный hold)
      description: |
        Создаёт временную бронь на 10 минут (`expires_at`).

        **Конкурентность.** Операция выполняется в транзакции с
        `SELECT ... FOR UPDATE` на строках inventory. Если хотя бы одно место уже
        занято, **весь запрос отклоняется** и ни одно место не бронируется —
        частичная бронь оставила бы покупателя с половиной заказа.

        **Идемпотентность.** Требуется `Idempotency-Key`: повтор запроса при обрыве
        сети не должен создавать вторую бронь.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: integer }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, inventory_item_ids]
              properties:
                session_id: { type: integer }
                inventory_item_ids:
                  type: array
                  minItems: 1
                  maxItems: 8
                  items: { type: integer }
                  description: Максимум задаётся nabilet.ticketing.max_seats_per_order
      responses:
        '201':
          description: Бронь создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Hold' }
        '409':
          description: |
            Место недоступно. Возможные коды: `SEAT_UNAVAILABLE`,
            `HOLD_EXPIRED`, `SALES_CLOSED`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /holds/{holdId}:
    delete:
      tags: [Seats]
      summary: Освободить бронь
      description: Переводит hold в `released`, место возвращается в `available`.
      parameters:
        - name: holdId
          in: path
          required: true
          schema: { type: integer }
      responses:
        '204': { description: Освобождено }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────────────────────────────────────────────── Cart ──
  /cart:
    get:
      tags: [Cart]
      summary: Текущая корзина
      description: |
        Корзина существует и для гостя без аккаунта (ТЗ §83): идентифицируется
        подписанным cookie-токеном.
      responses:
        '200':
          description: Корзина
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Cart' }
    post:
      tags: [Cart]
      summary: Создать корзину из брони
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hold_id]
              properties:
                hold_id: { type: integer }
                promo_code: { type: string }
      responses:
        '201':
          description: Корзина создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Cart' }
        '409':
          description: Бронь истекла
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /cart/promo-code:
    post:
      tags: [Cart]
      summary: Применить промокод
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: Промокод применён; корзина пересчитана
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Cart' }
        '422':
          description: Промокод недействителен
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ───────────────────────────────────────────────────────────────── Orders ──
  /orders:
    post:
      tags: [Orders]
      summary: Создать заказ
      description: |
        Создаёт заказ из корзины и инициирует платёж. Работает **без регистрации**
        (ТЗ §83): аккаунт может быть создан после покупки.

        Требуется `Idempotency-Key`. Без него повтор при обрыве сети создаст второй
        заказ на те же места.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cart_id, email]
              properties:
                cart_id: { type: integer }
                email: { type: string, format: email }
                phone: { type: string }
                first_name: { type: string }
                last_name: { type: string }
                payment_provider:
                  type: string
                  default: yookassa
                locale: { type: string, default: ru }
                customer_note: { type: string, maxLength: 1024 }
      responses:
        '201':
          description: Заказ создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Order' }
        '409':
          description: Бронь истекла, место недоступно или ключ идемпотентности переиспользован
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /orders/{orderNumber}:
    get:
      tags: [Orders]
      summary: Заказ по номеру
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema: { type: string, example: NB-2026-000123 }
      responses:
        '200':
          description: Заказ с билетами
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Order' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{orderNumber}/refund:
    post:
      tags: [Orders]
      summary: Возврат — полный или частичный
      description: |
        Требует права `orders.refund`. Полный возврат переводит заказ в `refunded`;
        частичный — в `partially_refunded`. Переход в `refunded` разрешён только
        когда возвращённая сумма равна сумме заказа.
      security:
        - bearerAuth: []
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: string
                  enum: [full, partial]
                  default: full
                order_item_ids:
                  type: array
                  items: { type: integer }
                  description: Обязательно при scope=partial
                reason: { type: string, maxLength: 512 }
      responses:
        '202':
          description: Возврат принят в обработку (асинхронно)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Refund' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Возврат невозможен в текущем статусе заказа
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ─────────────────────────────────────────────────────────────── Payments ──
  /webhooks/payments/{provider}:
    post:
      tags: [Payments]
      summary: Вебхук платёжного провайдера
      description: |
        **Без аутентификации пользователя** — вызывается провайдером. Защита:
        проверка подписи, allowlist IP провайдера, отдельный rate limit.

        **Идемпотентность обязательна.** `provider_event_id` уникален: обработчик
        сначала вставляет запись в журнал транзакций; нарушение уникальности означает
        «уже обработано», и обработчик возвращает 200, **не меняя состояние заказа и
        билетов**. Три одинаковых `payment.succeeded` дают один оплаченный заказ и
        одну выдачу билетов (ТЗ §28).

        Всегда возвращайте 200 на корректно подписанный вебхук, даже если он уже
        обработан — иначе провайдер будет повторять доставку.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [yookassa] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Сырое тело провайдера; сохраняется как есть для разбора споров
      responses:
        '200':
          description: Принято (в том числе при повторе)
        '400':
          description: Подпись недействительна
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ──────────────────────────────────────────────────────────────── Tickets ──
  /tickets:
    get:
      tags: [Tickets]
      summary: Мои билеты
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
            enum: [issued, used, refunded, canceled, revoked, expired]
        - name: scope
          in: query
          schema:
            type: string
            enum: [upcoming, past, all]
            default: upcoming
      responses:
        '200':
          description: Список билетов
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Ticket' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }

  /tickets/{ticketNumber}:
    get:
      tags: [Tickets]
      summary: Билет по номеру
      parameters:
        - name: ticketNumber
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Билет
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Ticket' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tickets/{ticketNumber}/pdf:
    get:
      tags: [Tickets]
      summary: PDF билета
      parameters:
        - name: ticketNumber
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────────────────────────────────────────── Check-in ──
  /checkin/validate:
    post:
      tags: [Check-in]
      summary: Проверить билет, не гася его
      description: |
        Используется сканером **перед** подтверждением входа, чтобы показать
        оператору, кого он пропускает.

        Высокий rate limit (600/мин): оператор, сканирующий очередь из 500 человек,
        не должен быть ограничен. Аутентификация — по ключу устройства
        (`X-Device-Key`), не по пользовательской сессии.
      security:
        - deviceKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket_token]
              properties:
                ticket_token: { type: string, description: 'Строка из QR: NB1.<id>.<token>.<sig>' }
                session_id: { type: integer }
      responses:
        '200':
          description: Результат проверки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckinResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /checkin/use:
    post:
      tags: [Check-in]
      summary: Погасить билет (вход разрешён)
      description: |
        Переводит билет `issued → used`. Повторный вызов возвращает
        `result: already_used` **с исходным временем и устройством** (ТЗ §32) —
        сканеру нужно показать оператору, что произошло.

        Идемпотентен по устройству и токену: сетевой повтор не «погасит» билет дважды.
      security:
        - deviceKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket_token]
              properties:
                ticket_token: { type: string }
                session_id: { type: integer }
      responses:
        '200':
          description: Результат
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckinResult' }

  /checkin/bundle:
    get:
      tags: [Check-in]
      summary: Офлайн-бандл для устройства
      description: |
        Подписанный набор `(ticket_id, token)`-дайджестов для локальной проверки
        (ТЗ §33). Устройство **не получает ключ подписи**: компрометация планшета не
        позволяет подделать билеты. Бандл имеет срок действия.

        Полностью исключить двойной проход одними офлайн-устройствами невозможно —
        сервер выполняет сверку после синхронизации.
      security:
        - deviceKeyAuth: []
      parameters:
        - name: session_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Бандл
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      session_id: { type: integer }
                      ticket_count: { type: integer }
                      payload_hash: { type: string }
                      signature: { type: string }
                      expires_at: { type: string, format: date-time }
                      digests:
                        type: array
                        items:
                          type: object
                          properties:
                            ticket_id: { type: integer }
                            digest: { type: string }

  /checkin/sync:
    post:
      tags: [Check-in]
      summary: Синхронизация офлайн-сканирований
      description: |
        Принимает журнал локальных сканирований. Сервер выполняет сверку
        (reconciliation): при конфликте двух офлайн-сканов одного билета побеждает
        более ранний по времени сканирования, второй помечается конфликтом.
      security:
        - deviceKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scans]
              properties:
                scans:
                  type: array
                  items:
                    type: object
                    required: [ticket_token, scanned_at]
                    properties:
                      ticket_token: { type: string }
                      scanned_at: { type: string, format: date-time }
                      result: { type: string }
      responses:
        '200':
          description: Результат сверки
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: integer }
                  rejected: { type: integer }
                  conflicts:
                    type: array
                    items:
                      type: object
                      properties:
                        ticket_id: { type: integer }
                        resolution: { type: string, enum: [first_scan_wins, duplicate] }

  # ────────────────────────────────────────────────────────────────── Embed ──
  /embed/events/{eventId}:
    get:
      tags: [Embed]
      summary: Мероприятие для встраивания
      description: |
        Origin проверяется **на бэкенде** по whitelist доменов, а не только в
        браузере (ТЗ §50): клиентская проверка обходится тривиально.
      security: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: integer }
        - name: theme
          in: query
          schema: { type: string, enum: [light, dark, auto] }
        - name: primary
          in: query
          schema: { type: string, example: '#00A800' }
        - name: radius
          in: query
          schema: { type: integer, example: 12 }
      responses:
        '200':
          description: Данные мероприятия
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/EventSummary' }
        '403':
          description: Origin не входит в whitelist доменов

  # ────────────────────────────────────────────────────────────────── Users ──
  /me:
    get:
      tags: [Users]
      summary: Текущий пользователь
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/sessions:
    get:
      tags: [Users]
      summary: Активные сессии
      description: Пользователь видит устройство, время, IP и может завершить сессию (ТЗ §8).
      responses:
        '200':
          description: Сессии
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/UserSession' }
    delete:
      tags: [Users]
      summary: Завершить все сессии кроме текущей
      responses:
        '204': { description: Завершено }

  /health:
    get:
      tags: [Users]
      summary: Liveness
      security: []
      responses:
        '200':
          description: Сервис жив
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /ready:
    get:
      tags: [Users]
      summary: Readiness
      description: Проверяет БД, Redis, очередь, storage, cron, mail и внешние сервисы (ТЗ §73).
      security: []
      responses:
        '200':
          description: Все зависимости доступны
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  checks:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        status: { type: string, enum: [ok, degraded, down] }
                        latency_ms: { type: integer }
        '503':
          description: Деградация

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token (15 минут). Refresh token — в httpOnly cookie, прозрачное
        обновление при 401. Токены не хранятся в localStorage (риск XSS).
    deviceKeyAuth:
      type: apiKey
      in: header
      name: X-Device-Key
      description: Ключ устройства контроля входа. Хранится только в виде хэша.

  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: Курсор пагинации из предыдущего ответа
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 191 }
      description: |
        Ключ идемпотентности. Настоятельно рекомендуется для всех изменяющих
        запросов. Повтор с тем же ключом и тем же телом вернёт запомненный ответ;
        с другим телом — ошибку `IDEMPOTENCY_KEY_REUSED`.

  responses:
    NotFound:
      description: Объект не найден (или принадлежит другой организации)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Требуется аутентификация
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Недостаточно прав
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationError:
      description: Ошибка валидации с пофайловыми сообщениями
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: Превышен лимит запросов
      headers:
        Retry-After:
          schema: { type: integer }
          description: Секунд до следующей попытки
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: RFC 7807. Клиенты ветвятся по `title` (машиночитаемый код).
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          example: https://nabilet.ru/errors/seat-unavailable
        title:
          type: string
          description: Стабильный код ошибки
          example: SEAT_UNAVAILABLE
        status: { type: integer, example: 409 }
        detail: { type: string, example: This seat is no longer available. }
        context:
          type: object
          additionalProperties: true
          example: { inventory_item_id: '99120' }
        request_id:
          type: string
          description: Идентификатор запроса для обращения в поддержку
        errors:
          type: object
          description: Пофайловые ошибки валидации (только при VALIDATION_ERROR)
          additionalProperties:
            type: array
            items: { type: string }

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          description: Minor units (копейки). Вычисления — только по этому полю.
          example: 530000
        currency: { type: string, example: RUB }
        decimal:
          type: string
          description: Только для отображения. Не использовать для вычислений.
          example: '5300.00'

    PaginationMeta:
      type: object
      properties:
        next_cursor: { type: string, nullable: true }
        prev_cursor: { type: string, nullable: true }
        per_page: { type: integer }
        has_more: { type: boolean }

    EventSummary:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        short_description: { type: string, nullable: true }
        poster_url: { type: string, nullable: true, format: uri }
        age_limit: { type: integer, nullable: true }
        duration_minutes: { type: integer, nullable: true }
        category:
          type: object
          nullable: true
          properties:
            slug: { type: string }
            name: { type: string }
        venue:
          type: object
          nullable: true
          properties:
            slug: { type: string }
            name: { type: string }
            city: { type: string, nullable: true }
        next_session_at: { type: string, nullable: true, format: date-time }
        price_from: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [published, completed] }

    EventDetail:
      allOf:
        - $ref: '#/components/schemas/EventSummary'
        - type: object
          properties:
            description: { type: string, nullable: true }
            cover_url: { type: string, nullable: true, format: uri }
            gallery:
              type: array
              items: { type: string, format: uri }
            seo:
              type: object
              properties:
                title: { type: string, nullable: true }
                description: { type: string, nullable: true }
                canonical: { type: string, nullable: true }
            sessions:
              type: array
              items: { $ref: '#/components/schemas/SessionSummary' }

    SessionSummary:
      type: object
      properties:
        id: { type: integer }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, nullable: true, format: date-time }
        timezone: { type: string }
        status: { type: string, enum: [draft, scheduled, on_sale, sold_out, finished, canceled] }
        sales_start: { type: string, nullable: true, format: date-time }
        sales_end: { type: string, nullable: true, format: date-time }
        price_from: { $ref: '#/components/schemas/Money' }
        available_count: { type: integer, description: Вычисляется по inventory, никогда не кэшируется }

    SessionDetail:
      allOf:
        - $ref: '#/components/schemas/SessionSummary'
        - type: object
          properties:
            capacity_total: { type: integer }
            capacity_sold: { type: integer }
            venue:
              type: object
              properties:
                slug: { type: string }
                name: { type: string }
                address: { type: string, nullable: true }
                city: { type: string, nullable: true }
                metro: { type: string, nullable: true }
                latitude: { type: number, nullable: true }
                longitude: { type: number, nullable: true }

    SeatMap:
      type: object
      description: |
        Геометрия из неизменяемой версии схемы + текущие статусы мест.
        Геометрия кэшируема, статусы — нет.
      properties:
        session_id: { type: integer }
        schema_version: { type: integer }
        canvas:
          type: object
          properties:
            width: { type: integer }
            height: { type: integer }
            unit: { type: string }
        background:
          type: object
          nullable: true
          properties:
            url: { type: string, format: uri }
            opacity: { type: number }
        objects:
          type: array
          description: Сцена, входы, подписи и прочее
          items: { $ref: '#/components/schemas/SchemaObject' }
        sectors:
          type: array
          items: { $ref: '#/components/schemas/Sector' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/Row' }
        seats:
          type: array
          items: { $ref: '#/components/schemas/Seat' }
        standing_zones:
          type: array
          items: { $ref: '#/components/schemas/StandingZone' }

    SchemaObject:
      type: object
      properties:
        type: { type: string, enum: [stage, entrance, exit, toilet, bar, wardrobe, text, image, line, rect, icon, custom] }
        label: { type: string, nullable: true }
        text: { type: string, nullable: true }
        x: { type: number }
        y: { type: number }
        width: { type: number }
        height: { type: number }
        rotation: { type: number }
        color: { type: string, nullable: true }
        z_index: { type: integer }

    Sector:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        type: { type: string, enum: [seated, standing, mixed] }
        capacity: { type: integer }
        color: { type: string }
        x: { type: number }
        y: { type: number }
        width: { type: number }
        height: { type: number }
        rotation: { type: number }

    Row:
      type: object
      properties:
        id: { type: integer }
        sector_id: { type: integer }
        number: { type: integer }
        name: { type: string, nullable: true }
        direction: { type: string, enum: [ltr, rtl] }
        base_price: { $ref: '#/components/schemas/Money' }

    Seat:
      type: object
      properties:
        id: { type: integer }
        inventory_item_id: { type: integer }
        sector_id: { type: integer }
        row_id: { type: integer }
        number: { type: integer }
        label: { type: string, nullable: true }
        type: { type: string, enum: [standard, vip, wheelchair, companion, blocked, custom] }
        status: { type: string, enum: [available, held, sold, blocked, disabled] }
        price: { $ref: '#/components/schemas/Money' }
        x: { type: number }
        y: { type: number }
        width: { type: number }
        height: { type: number }
        rotation: { type: number }

    StandingZone:
      type: object
      description: Мест нет — продаётся вместимость (ТЗ §21)
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        capacity: { type: integer }
        available: { type: integer }
        price: { $ref: '#/components/schemas/Money' }
        x: { type: number }
        y: { type: number }
        width: { type: number }
        height: { type: number }

    Hold:
      type: object
      properties:
        id: { type: integer }
        session_id: { type: integer }
        status: { type: string, enum: [active, converted, expired, released] }
        expires_at: { type: string, format: date-time }
        expires_in_seconds: { type: integer }
        items:
          type: array
          items:
            type: object
            properties:
              inventory_item_id: { type: integer }
              label: { type: string }
              price: { $ref: '#/components/schemas/Money' }

    Cart:
      type: object
      properties:
        id: { type: integer }
        session_id: { type: integer }
        status: { type: string, enum: [active, converted, abandoned, expired] }
        expires_at: { type: string, nullable: true, format: date-time }
        items:
          type: array
          items:
            type: object
            properties:
              inventory_item_id: { type: integer }
              description: { type: string }
              unit_price: { $ref: '#/components/schemas/Money' }
              quantity: { type: integer }
              total: { $ref: '#/components/schemas/Money' }
        totals:
          type: object
          properties:
            subtotal: { $ref: '#/components/schemas/Money' }
            discount: { $ref: '#/components/schemas/Money' }
            fee: { $ref: '#/components/schemas/Money' }
            total: { $ref: '#/components/schemas/Money' }
        promo_code: { type: string, nullable: true }

    Order:
      type: object
      properties:
        order_number: { type: string, example: NB-2026-000123 }
        status:
          type: string
          enum: [pending, awaiting_payment, paid, partially_refunded, refunded, canceled, expired, failed]
        payment_status:
          type: string
          enum: [unpaid, pending, paid, partially_refunded, refunded, failed]
        email: { type: string }
        phone: { type: string, nullable: true }
        totals:
          type: object
          properties:
            subtotal: { $ref: '#/components/schemas/Money' }
            discount: { $ref: '#/components/schemas/Money' }
            fee: { $ref: '#/components/schemas/Money' }
            total: { $ref: '#/components/schemas/Money' }
            refunded: { $ref: '#/components/schemas/Money' }
        expires_at: { type: string, nullable: true, format: date-time }
        paid_at: { type: string, nullable: true, format: date-time }
        created_at: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            properties:
              inventory_item_id: { type: integer }
              description: { type: string }
              status: { type: string, enum: [reserved, paid, issued, refunded, canceled] }
              unit_price: { $ref: '#/components/schemas/Money' }
              total: { $ref: '#/components/schemas/Money' }
        tickets:
          type: array
          items: { $ref: '#/components/schemas/Ticket' }
        payment:
          type: object
          nullable: true
          properties:
            provider: { type: string }
            status: { type: string }
            confirmation_url: { type: string, nullable: true, format: uri }

    Ticket:
      type: object
      properties:
        ticket_number: { type: string }
        status: { type: string, enum: [issued, used, refunded, canceled, revoked, expired] }
        holder_name: { type: string, nullable: true }
        seat_label: { type: string, nullable: true, example: 'Сектор A, ряд 12, место 18' }
        qr:
          type: object
          description: |
            Подписанный payload. **Не содержит персональных данных** (ТЗ §30):
            только идентификатор билета, случайный токен и HMAC-подпись.
          properties:
            payload: { type: string, example: 'NB1.99120.9f3a...c1.Zm9v...' }
            key_id: { type: string, example: k1 }
            image_url: { type: string, format: uri }
        issued_at: { type: string, format: date-time }
        used_at: { type: string, nullable: true, format: date-time }
        event:
          type: object
          properties:
            title: { type: string }
            slug: { type: string }
        session:
          type: object
          properties:
            id: { type: integer }
            starts_at: { type: string, format: date-time }
            venue_name: { type: string }
            venue_address: { type: string, nullable: true }
        pdf_url: { type: string, nullable: true, format: uri }

    Refund:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [requested, processing, succeeded, failed] }
        scope: { type: string, enum: [full, partial] }
        amount: { $ref: '#/components/schemas/Money' }
        reason: { type: string, nullable: true }
        requested_at: { type: string, format: date-time }
        processed_at: { type: string, nullable: true, format: date-time }

    CheckinResult:
      type: object
      required: [valid, result]
      properties:
        valid: { type: boolean }
        result:
          type: string
          enum: [valid, already_used, invalid_signature, not_found, wrong_session, revoked, refunded, expired, not_yet_valid]
        message: { type: string, description: Текст для показа оператору }
        ticket:
          type: object
          nullable: true
          properties:
            ticket_number: { type: string }
            holder_name: { type: string, nullable: true }
            event_title: { type: string }
            session_starts_at: { type: string, format: date-time }
            sector: { type: string, nullable: true }
            row: { type: string, nullable: true }
            seat: { type: string, nullable: true }
        used_at: { type: string, nullable: true, format: date-time, description: Для already_used }
        used_by_device: { type: string, nullable: true, description: Для already_used }

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: string, nullable: true }
        locale: { type: string }
        email_verified: { type: boolean }
        two_factor_enabled: { type: boolean }
        is_guest: { type: boolean, description: Аккаунт создан неявно после покупки без регистрации }
        created_at: { type: string, format: date-time }

    UserSession:
      type: object
      properties:
        id: { type: integer }
        device: { type: string, example: 'Chrome / Windows' }
        ip: { type: string, nullable: true }
        last_activity_at: { type: string, format: date-time }
        is_current: { type: boolean }
