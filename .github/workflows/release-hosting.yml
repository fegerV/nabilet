name: Release hosting ZIP

# Пайплайн: gates → package → smoke → browser E2E → publish.
# Публикация НИКОГДА не происходит из job'а package: артефакт сначала
# проходит чистую установку и браузерные сценарии, и только затем
# публикуется тот же самый ZIP с проверенными SHA-256/подписью/commit SHA.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer, должен совпадать с config/nabilet.php и package.json'
        required: true
        type: string
      require_signature:
        description: 'Прервать сборку, если ключ подписи не настроен'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gates:
    name: All mandatory checks (same commit)
    uses: ./.github/workflows/ci.yml

  package:
    name: Build portable hosting archive
    needs: gates
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, mbstring, openssl, pdo, pdo_mysql, curl, zip
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            V='${{ inputs.version }}'
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "Release version: $V"

      - name: Version consistency (strict, dated CHANGELOG section required)
        run: php tools/verify-release-version.php --version=${{ steps.version.outputs.value }}

      - name: Build SPA from a clean tree
        shell: bash
        run: |
          set -e
          rm -rf dist
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run test
          npm run build
          for needle in '<div id="app"></div>' '<title>' '<meta name="description"' '</head>'; do
            grep -qF "$needle" dist/index.html || { echo "::error::dist/index.html lost '$needle'"; exit 1; }
          done
          test -d dist/assets || { echo "::error::dist/assets was not produced"; exit 1; }

      - name: Sign manifest when a release key is configured
        shell: bash
        env:
          PRIVATE_KEY_PEM: ${{ secrets.NABILET_UPDATE_PRIVATE_KEY_PEM }}
          REQUIRE_SIGNATURE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.require_signature == true }}
        run: |
          set -e
          if [ -n "$PRIVATE_KEY_PEM" ]; then
            printf '%s' "$PRIVATE_KEY_PEM" > "$RUNNER_TEMP/update-private-key.pem"
            chmod 600 "$RUNNER_TEMP/update-private-key.pem"
            echo "NABILET_UPDATE_PRIVATE_KEY=$RUNNER_TEMP/update-private-key.pem" >> "$GITHUB_ENV"
            echo "Manifest will be signed."
          elif [ "$REQUIRE_SIGNATURE" = "true" ]; then
            echo "::error::Внешний обновлятор требует подпись, но секрет NABILET_UPDATE_PRIVATE_KEY_PEM не задан."
            exit 1
          else
            echo "::warning::Манифест будет без подписи: доступна только ручная загрузка архива."
          fi

      - name: Build ZIP, SHA-256 and manifest
        shell: bash
        run: |
          set -e
          mkdir -p release-artifacts
          php scripts/build-hosting-zip.php \
            --version=${{ steps.version.outputs.value }} \
            --output-dir=release-artifacts

      - name: Verify the built archive before any publication
        shell: bash
        run: |
          set -e
          ls -lh release-artifacts
          php tools/verify-release-artifact.php \
            --manifest=release-artifacts/manifest.json \
            --expected-version=${{ steps.version.outputs.value }} \
            --expected-commit="$GITHUB_SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: hosting-release-${{ steps.version.outputs.value }}
          path: release-artifacts/*
          if-no-files-found: error

  smoke:
    name: Clean install from the exact release ZIP
    needs: package
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP for the smoke stand
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, mbstring, openssl, pdo, pdo_mysql, curl, zip
          coverage: none
          tools: none

      - uses: actions/download-artifact@v4
        with:
          name: hosting-release-${{ needs.package.outputs.version }}
          path: ${{ runner.temp }}/release-artifact

      - name: Verify downloaded artifact and unpack it
        shell: bash
        run: |
          set -e
          php tools/verify-release-artifact.php \
            --manifest="$RUNNER_TEMP/release-artifact/manifest.json" \
            --expected-version=${{ needs.package.outputs.version }} \
            --expected-commit="$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/site"
          unzip -q "$RUNNER_TEMP/release-artifact"/*.zip -d "$RUNNER_TEMP/site"
          test -f "$RUNNER_TEMP/site/public_html/index.php"
          test -f "$RUNNER_TEMP/site/vendor/autoload.php"
          test ! -e "$RUNNER_TEMP/site/.env"
          cp scripts/smoke/router-smoke.php "$RUNNER_TEMP/site/public_html/router-smoke.php"

      - name: Prepare a clean database
        run: php scripts/smoke/db-setup-smoke.php

      - name: Allow trigger creation without SUPER
        shell: bash
        run: |
          mysql -h 127.0.0.1 -P 3307 -uroot -prootpass \
            -e "SET GLOBAL log_bin_trust_function_creators = 1;"

      - name: Start the stand (emulates .htaccess from public_html)
        shell: bash
        run: |
          set -e
          cd "$RUNNER_TEMP/site/public_html"
          php -S 127.0.0.1:8088 router-smoke.php > "$RUNNER_TEMP/php-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8088/robots.txt > /dev/null 2>&1; then
              echo "stand ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/php-server.log"
          exit 1

      - name: Run the full installer smoke scenario
        shell: bash
        run: |
          set -e
          cp scripts/smoke/smoke-install.php "$RUNNER_TEMP/smoke-install.php"
          php "$RUNNER_TEMP/smoke-install.php"

      - name: Verify the installer key was consumed
        shell: bash
        run: |
          set -e
          test ! -e "$RUNNER_TEMP/site/storage/install.key"
          test -e "$RUNNER_TEMP/site/storage/install.lock"

      - name: Upload stand logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-stand-logs
          path: |
            ${{ runner.temp }}/php-server.log
            ${{ runner.temp }}/site/storage/logs/*.log
          if-no-files-found: ignore

  browser-e2e:
    name: Browser E2E on a freshly installed stand
    needs: [package, smoke]
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, mbstring, openssl, pdo, pdo_mysql, curl, zip
          coverage: none
          tools: none

      - name: Set up Node and Chromium
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - uses: actions/download-artifact@v4
        with:
          name: hosting-release-${{ needs.package.outputs.version }}
          path: ${{ runner.temp }}/release-artifact

      - name: Install the exact ZIP and start the stand
        shell: bash
        run: |
          set -e
          php tools/verify-release-artifact.php \
            --manifest="$RUNNER_TEMP/release-artifact/manifest.json" \
            --expected-version=${{ needs.package.outputs.version }} \
            --expected-commit="$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/site"
          unzip -q "$RUNNER_TEMP/release-artifact"/*.zip -d "$RUNNER_TEMP/site"
          cp scripts/smoke/router-smoke.php "$RUNNER_TEMP/site/public_html/router-smoke.php"
          php scripts/smoke/db-setup-smoke.php
          mysql -h 127.0.0.1 -P 3307 -uroot -prootpass -e "SET GLOBAL log_bin_trust_function_creators = 1;"
          cp scripts/smoke/smoke-install.php "$RUNNER_TEMP/smoke-install.php"
          cd "$RUNNER_TEMP/site/public_html"
          php -S 127.0.0.1:8088 router-smoke.php > "$RUNNER_TEMP/php-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          READY=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8088/robots.txt > /dev/null 2>&1; then READY=1; break; fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then cat "$RUNNER_TEMP/php-server.log"; exit 1; fi
          php "$RUNNER_TEMP/smoke-install.php"

      - name: Run browser scenarios
        shell: bash
        env:
          E2E_BASE_URL: http://127.0.0.1:8088
          E2E_ADMIN_EMAIL: admin@smoke.local
          E2E_ADMIN_PASSWORD: adminpass123
        run: npm run e2e -- --grep "smoke stand"

      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  publish:
    name: Publish only after all gates pass
    needs: [gates, package, smoke, browser-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, mbstring, openssl, pdo, pdo_mysql, curl, zip
          coverage: none
          tools: composer:v2

      - uses: actions/download-artifact@v4
        with:
          name: hosting-release-${{ needs.package.outputs.version }}
          path: ${{ runner.temp }}/release-artifact

      - name: Derive public key from the release secret
        shell: bash
        env:
          PRIVATE_KEY_PEM: ${{ secrets.NABILET_UPDATE_PRIVATE_KEY_PEM }}
        run: |
          set -e
          if [ -n "$PRIVATE_KEY_PEM" ]; then
            printf '%s' "$PRIVATE_KEY_PEM" > "$RUNNER_TEMP/update-private-key.pem"
            chmod 600 "$RUNNER_TEMP/update-private-key.pem"
            openssl pkey -in "$RUNNER_TEMP/update-private-key.pem" -pubout -out "$RUNNER_TEMP/update-public.pem"
            echo "PUBLIC_KEY=$RUNNER_TEMP/update-public.pem" >> "$GITHUB_ENV"
            echo "CHECK_SIGNATURE=--check-signature" >> "$GITHUB_ENV"
          else
            echo "PUBLIC_KEY=" >> "$GITHUB_ENV"
            echo "CHECK_SIGNATURE=" >> "$GITHUB_ENV"
            echo "::warning::Ключ подписи не настроен: подпись не проверяется."
          fi

      - name: Final verification of the ZIP to be published
        shell: bash
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -e
          php tools/verify-release-artifact.php \
            --manifest="$RUNNER_TEMP/release-artifact/manifest.json" \
            --expected-version="$VERSION" \
            --expected-commit="$GITHUB_SHA" \
            --public-key="$PUBLIC_KEY" $CHECK_SIGNATURE

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -e
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-artifact"/* \
            --verify-tag \
            --title "NABILET $VERSION" \
            --notes "Установочный архив для shared hosting. Распаковывать в каталог сайта на уровень выше public_html. SHA-256 — в .sha256, подпись и commit SHA — в manifest.json."
