<!DOCTYPE html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="NABILET — билеты на события: выбор мест на схеме зала, оплата и QR-билеты." />
    <title>NABILET — билеты на события</title>
    <script>
      /* Тема применяется до первой отрисовки: иначе интерфейс мигает светлым. */
      (function () {
        try {
          var stored = localStorage.getItem('nabilet.theme')
          var dark = stored === 'dark' || ((!stored || stored === 'auto') && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
    <script type="module" crossorigin src="./assets/index-CGHxov3-.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/style-DUEIbFNR.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
