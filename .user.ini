; NABILET Core — TimeWeb shared hosting (PHP 8.3)
;
; Read by the PHP-FPM / CGI SAPI for the document root (public_html/) and every
; subdirectory below it. These settings do NOT apply to CLI `artisan` runs —
; set those in the shell / cron if you need them there.
;
; The PHP version itself is selected in the TimeWeb control panel — pin 8.3.
; The code already targets ^8.3 (composer.json) and contains no PHP 8.4-only
; syntax (no property hooks, no asymmetric visibility). Verify on the host with:
;     composer check-platform-reqs

display_errors = Off
log_errors      = On
expose_php      = Off

upload_max_filesize = 32M
post_max_size       = 64M
memory_limit        = 256M
max_execution_time  = 120
max_input_time      = 120

; Secure session cookies — served over HTTPS only.
session.cookie_secure  = On
session.cookie_httponly = On
session.cookie_samesite = Lax
