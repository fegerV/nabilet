name: Android release

# Подписанный APK по тегу checker-v<версия>, например:
#   git tag checker-v1.2.0 && git push origin checker-v1.2.0
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   NABILET_KEYSTORE_BASE64    — keystore, закодированный в base64
#   NABILET_KEYSTORE_PASSWORD  — пароль хранилища
#   NABILET_KEY_ALIAS          — алиас ключа
#   NABILET_KEY_PASSWORD       — пароль ключа
#
# Подробности и чек-лист выдачи устройства: android/docs/RELEASE.md

on:
  push:
    tags:
      - 'checker-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия без префикса, например 1.2.0'
        required: true
        type: string

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#checker-v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Не удалось определить версию."
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Версия: $VERSION (${{ github.run_number }})"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NABILET_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Секрет NABILET_KEYSTORE_BASE64 не задан — подписывать нечем."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nabilet-checker.jks"
          echo "NABILET_KEYSTORE_PATH=$RUNNER_TEMP/nabilet-checker.jks" >> "$GITHUB_ENV"

      - name: Build signed release
        env:
          NABILET_KEYSTORE_PASSWORD: ${{ secrets.NABILET_KEYSTORE_PASSWORD }}
          NABILET_KEY_ALIAS: ${{ secrets.NABILET_KEY_ALIAS }}
          NABILET_KEY_PASSWORD: ${{ secrets.NABILET_KEY_PASSWORD }}
        run: |
          missing=0
          for name in NABILET_KEYSTORE_PASSWORD NABILET_KEY_ALIAS NABILET_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Секрет $name не задан."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

          ./gradlew --no-daemon --stacktrace assembleRelease \
            -PappVersionCode="${{ steps.version.outputs.code }}" \
            -PappVersionName="${{ steps.version.outputs.name }}"

      - name: Verify signature
        run: |
          APK="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          case "$APK" in
            *unsigned*) echo "::error::Сборка не подписана: $APK"; exit 1 ;;
          esac
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk \
            "out/nabilet-checker-${{ steps.version.outputs.name }}.apk"
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt out/mapping.txt
          fi
          ls -lh out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nabilet-checker-release-${{ steps.version.outputs.name }}
          path: android/out/
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "out/nabilet-checker-${{ steps.version.outputs.name }}.apk" \
            out/mapping.txt \
            --title "NABILET Checker ${{ steps.version.outputs.name }}" \
            --notes "Подписанный APK контролёра и mapping.txt для разбора стектрейсов R8." \
            --verify-tag

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/nabilet-checker.jks"
