# NABILET Core — nginx front end.
#
# Two things here are deliberate and easy to get wrong:
#
# 1. `try_files $uri /index.php?$query_string` — NOT `$uri/`. Adding a directory
#    fallback lets nginx serve an auto-index of /storage or /app when a request
#    misses, which turns a 404 into a directory listing.
#
# 2. Static assets are served by nginx and everything else goes to PHP-FPM on
#    `app:9000`. The upstream is named by compose service, so it must match the
#    service key in docker-compose.yml.

upstream php-fpm {
    server app:9000;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 32m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /favicon.ico { access_log off; log_not_found off; return 204; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ── Загруженные пользователем файлы (/storage) ───────────────────────────
    #
    # Эти файлы приходят от организаторов, поэтому к ним нельзя относиться как к
    # статике приложения. Два заголовка закрывают разные сценарии:
    #
    #   `Content-Disposition: attachment` — браузер СКАЧИВАЕТ pdf вместо того,
    #   чтобы открыть его встроенной читалкой. Встроенный просмотр PDF исполняет
    #   JavaScript, встроенный в документ, и показывает фишинговые формы в
    #   контексте домена площадки. Для картинок и видео заголовок не ставится:
    #   они должны рисоваться на странице.
    #
    #   `Content-Security-Policy: default-src 'none'; sandbox` — на случай, если
    #   какой-то тип всё же будет отрендерен inline. `sandbox` без
    #   `allow-scripts` запрещает исполнение скриптов и доступ к origin, поэтому
    #   даже неожиданный HTML/SVG-подобный контент не получит доступ к
    #   localStorage и cookie покупателя. Это второй слой: первый — отказ
    #   сервера принимать `svg` (`MediaController::ALLOWED_TYPES`).
    #
    # `nosniff` уже добавлен глобально выше, но здесь он важен особенно: без него
    # браузер может «угадать» тип по содержимому и отрендерить файл как HTML.
    location ~* ^/storage/.*\.(pdf)$ {
        try_files $uri =404;
        add_header Content-Disposition "attachment" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Anything with a real file behind it is served directly (assets, uploads).
    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120;
        fastcgi_http_version 1.1;
        fastcgi_set_header Connection "";
    }

    # Never expose the application tree or its dotfiles.
    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/nabilet-access.log;
    error_log  /var/log/nginx/nabilet-error.log warn;
}
