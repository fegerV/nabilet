      operationId: listPageTranslations
      parameters:
        - $ref: '#/components/parameters/PageIdPath'
      responses:
        '200':
          description: Page translations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageTranslationListResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/pages/{page}/translations/{locale}:
    put:
      tags: [Translations]
      summary: Create or replace a page translation
      description: >-
        The localized slug is what makes /{locale}/pages/... URLs resolvable.
      operationId: upsertPageTranslation
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PageIdPath'
        - in: path
          name: locale
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PageTranslationUpsert' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageTranslationResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/checkin-devices/{device}/bundles:
    get:
      tags: [Admin Checkin]
      summary: List offline bundles issued to a device
      operationId: listOfflineBundles
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CheckinDeviceIdPath'
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200':
          description: Offline bundles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfflineBundleListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin Checkin]
      summary: Issue an offline bundle to a device
      description: >-
        Bundles the event, the session, the valid and revoked ticket lists and
        the public key so the Checker can work without a network.
      operationId: createOfflineBundle
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CheckinDeviceIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfflineBundleCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfflineBundleResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/offline-bundles/{bundle}:
    get:
      tags: [Admin Checkin]
      summary: Get offline bundle
      operationId: getOfflineBundle
      security:
        - bearerAuth: []
        - checkerAuth: []
      parameters:
        - $ref: '#/components/parameters/OfflineBundleIdPath'
      responses:
        '200':
          description: Offline bundle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfflineBundleResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/users/{user}/roles:
    get:
      tags: [Admin Users]
      summary: List roles granted to a user in an organization
      operationId: listUserRoles
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      responses:
        '200':
          description: Granted roles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserRoleListResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Admin Users]
      summary: Grant a role to a user
      operationId: assignUserRole
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserRoleAssign' }
      responses:
        '201':
          description: Granted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserRoleResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/users/{user}/roles/{role}:
    delete:
      tags: [Admin Users]
      summary: Revoke a role from a user
      operationId: revokeUserRole
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/UserIdPath'
        - $ref: '#/components/parameters/RoleIdPath'
      responses:
        '204': { description: Revoked }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    checkerAuth:
      type: http
      scheme: bearer
      bearerFormat: device-token
    checkoutAuth:
      type: apiKey
      in: header
      name: X-Checkout-Token

  parameters:
    EventIdPath:
      in: path
      name: event
      required: true
      schema: { type: string }
    SessionIdPath:
      in: path
      name: session
      required: true
      schema: { type: string }
    CartIdPath:
      in: path
      name: cart
      required: true
      schema: { type: string }
    CartItemIdPath:
      in: path
      name: item
      required: true
      schema: { type: string }
    OrderIdPath:
      in: path
      name: order
      required: true
      schema: { type: string }
    PaymentIdPath:
      in: path
      name: payment
      required: true
      schema: { type: string }
    TicketIdPath:
      in: path
      name: ticket
      required: true
      schema: { type: string }
    UserSessionIdPath:
      in: path
      name: session
      required: true
      schema: { type: string }
    VenueIdPath:
      in: path
      name: venue
      required: true
      schema: { type: string }
    HallIdPath:
      in: path
      name: hall
      required: true
      schema: { type: string }
    SchemaIdPath:
      in: path
      name: schema
      required: true
      schema: { type: string }
    PublicIdPath:
      in: path
      name: id
      required: true
      schema: { type: string }
      description: Public ULID identifier. Route aliases may expose entity names in generated documentation.
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      in: query
      name: per_page
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 16, maxLength: 255 }
    OAuthCode:
      in: query
      name: code
      required: true
      schema: { type: string }
    OAuthState:
      in: query
      name: state
      required: true
      schema: { type: string }
    EmbedToken:
      in: query
      name: embed_token
      required: false
      schema: { type: string }
    CheckoutToken:
      in: header
      name: X-Checkout-Token
      required: true
      schema: { type: string }

    PromoCodeIdPath:
      in: path
      name: promoCode
      required: true
      schema: { type: string }
    MediaAssetIdPath:
      in: path
      name: media
      required: true
      schema: { type: string }
    PageIdPath:
      in: path
      name: page
      required: true
      schema: { type: string }
    CheckinDeviceIdPath:
      in: path
      name: device
      required: true
      schema: { type: string }
    OfflineBundleIdPath:
      in: path
      name: bundle
      required: true
      schema: { type: string }
    UserIdPath:
      in: path
      name: user
      required: true
      schema: { type: string }
    RoleIdPath:
      in: path
      name: role
      required: true
      schema: { type: string }

  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: Conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    RateLimited:
      description: Rate limited
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: SEAT_ALREADY_HELD }
            message: { type: string }
            details: { type: object, additionalProperties: true }
            request_id: { type: string }

    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }

    User:
      type: object
      required: [id, status, locale, timezone]
      properties:
        id: { type: string }
        email: { type: string, format: email, nullable: true }
        email_verified_at: { type: string, format: date-time, nullable: true }
        first_name: { type: string, nullable: true }
        last_name: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        status: { type: string }
        locale: { type: string }
        timezone: { type: string }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time, nullable: true }

    UserResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/User' }

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12 }
        password_confirmation: { type: string }
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        phone: { type: string, maxLength: 50 }
        locale: { type: string, default: ru }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        remember: { type: boolean, default: false }

    AuthResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_at: { type: string, format: date-time, nullable: true }

    ProfileUpdateRequest:
      type: object
      properties:
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 50 }
        locale: { type: string }
        timezone: { type: string }

    UserSession:
      type: object
      properties:
        id: { type: string }
        device_name: { type: string, nullable: true }
        user_agent: { type: string, nullable: true }
        last_seen_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    Organization:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        status: { type: string }

    Event:
      type: object
      required: [id, title, slug, status]
      properties:
        id: { type: string }
        organization_id: { type: string }
        category_id: { type: string, nullable: true }
        title: { type: string }
        slug: { type: string }
        short_description: { type: string, nullable: true }
        description: { type: string, nullable: true }
        poster: { type: string, nullable: true }
        cover: { type: string, nullable: true }
        age_limit: { type: string, nullable: true }
        duration_minutes: { type: integer, nullable: true }
        status: { type: string }
        published_at: { type: string, format: date-time, nullable: true }
        seo:
          $ref: '#/components/schemas/SeoMeta'

    EventResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Event' }

    EventListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    EventWriteRequest:
      type: object
      required: [organization_id, title, slug]
      properties:
        organization_id: { type: string }
        category_id: { type: string, nullable: true }
        title: { type: string, maxLength: 500 }
        slug: { type: string, maxLength: 255 }
        short_description: { type: string }
        description: { type: string }
        poster: { type: string }
        cover: { type: string }
        age_limit: { type: string }
        duration_minutes: { type: integer, minimum: 0 }
        status: { type: string, enum: [draft, scheduled, published, completed, canceled, archived] }
        seo_title: { type: string }
        seo_description: { type: string }
        canonical_url: { type: string, format: uri }
        robots: { type: string }

    Venue:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        name: { type: string }
        slug: { type: string }
        city: { type: string, nullable: true }
        address: { type: string, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        status: { type: string }

    VenueResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Venue' }

    VenueListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Venue' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    VenueWriteRequest:
      type: object
      required: [organization_id, name, slug]
      properties:
        organization_id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        country: { type: string }
        region: { type: string }
        city: { type: string }
        address: { type: string }
        latitude: { type: number }
        longitude: { type: number }

    Hall:
      type: object
      properties:
        id: { type: string }
        venue_id: { type: string }
        name: { type: string }
        capacity: { type: integer, nullable: true }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        status: { type: string }

    HallResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Hall' }

    HallWriteRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        capacity: { type: integer, minimum: 0 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }

    HallSchemaVersion:
      type: object
      properties:
        id: { type: string }
        hall_id: { type: string }
        version: { type: integer }
        status: { type: string, enum: [draft, published, archived] }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        background_url: { type: string, nullable: true }
        schema: { $ref: '#/components/schemas/HallSchema' }
        published_at: { type: string, format: date-time, nullable: true }

    HallSchema:
      type: object
      required: [version, canvas, sectors, rows, seats, tables, objects]
      properties:
        version: { type: string }
        canvas:
          type: object
          properties:
            width: { type: number }
            height: { type: number }
        background:
          type: object
          nullable: true
          additionalProperties: true
        sectors:
          type: array
          items: { type: object, additionalProperties: true }
        rows:
          type: array
          items: { type: object, additionalProperties: true }
        seats:
          type: array
          items: { type: object, additionalProperties: true }
        tables:
          type: array
          items: { type: object, additionalProperties: true }
        objects:
          type: array
          items: { type: object, additionalProperties: true }

    HallSchemaResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/HallSchemaVersion' }

    HallSchemaWriteRequest:
      type: object
      required: [schema]
      properties:
        schema: { $ref: '#/components/schemas/HallSchema' }
        background_url: { type: string }
        width: { type: integer }
        height: { type: integer }

    Session:
      type: object
      required: [id, event_id, venue_id, hall_id, schema_version_id, starts_at, status]
      properties:
        id: { type: string }
        event_id: { type: string }
        venue_id: { type: string }
        hall_id: { type: string }
        schema_version_id: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time, nullable: true }
        sales_start_at: { type: string, format: date-time, nullable: true }
        sales_end_at: { type: string, format: date-time, nullable: true }
        timezone: { type: string }
        status: { type: string }

    SessionResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Session' }

    SessionListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Session' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    SessionWriteRequest:
      type: object
      required: [event_id, venue_id, hall_id, schema_version_id, starts_at]
      properties:
        event_id: { type: string }
        venue_id: { type: string }
        hall_id: { type: string }
        schema_version_id: { type: string }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time, nullable: true }
        sales_start_at: { type: string, format: date-time, nullable: true }
        sales_end_at: { type: string, format: date-time, nullable: true }
        timezone: { type: string }
        status: { type: string }

    InventoryItem:
      type: object
      required: [id, session_id, type, price_amount, currency, capacity, available_quantity, status]
      properties:
        id: { type: string }
        session_id: { type: string }
        type: { type: string, enum: [seat, standing] }
        seat_id: { type: string, nullable: true }
        standing_zone_id: { type: string, nullable: true }
        price_amount: { type: integer }
        currency: { type: string, example: RUB }
        capacity: { type: integer }
        available_quantity: { type: integer }
        status: { type: string }

    SeatMapResponse:
      type: object
      required: [session, schema, inventory]
      properties:
        session: { $ref: '#/components/schemas/Session' }
        schema: { $ref: '#/components/schemas/HallSchemaVersion' }
        inventory:
          type: array
          items: { $ref: '#/components/schemas/InventoryItem' }

    Cart:
      type: object
      properties:
        id: { type: string }
        session_id: { type: string }
        status: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        totals: { $ref: '#/components/schemas/MoneyTotals' }

    CartItem:
      type: object
      properties:
        id: { type: string }
        inventory_item_id: { type: string }
        quantity: { type: integer }
        unit_price: { type: integer }
        total_price: { type: integer }
        hold_expires_at: { type: string, format: date-time, nullable: true }
        seat_snapshot: { type: object, additionalProperties: true, nullable: true }

    CartResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Cart' }

    AddCartItemRequest:
      type: object
      required: [inventory_item_id, quantity]
      properties:
        inventory_item_id: { type: string }
        quantity: { type: integer, minimum: 1 }

    CreateOrderRequest:
      type: object
      required: [cart_id, customer_email]
      properties:
        cart_id: { type: string }
        customer_email: { type: string, format: email }
        customer_phone: { type: string }
        holder_name: { type: string }
        promo_code: { type: string }

    MoneyTotals:
      type: object
      description: >-
        Monetary amounts are integer minor units (kopecks), per spec 9. Never a
        float: 5000 RUB is 500000. Clients must format for display; the API never
        returns decimal strings.
      properties:
        subtotal_amount: { type: integer, description: Integer minor units (kopecks) }
        discount_amount: { type: integer, description: Integer minor units (kopecks) }
        fee_amount: { type: integer, description: Integer minor units (kopecks) }
        total_amount: { type: integer, description: Integer minor units (kopecks) }
        currency: { type: string, description: ISO 4217 code, e.g. RUB }

    Order:
      type: object
      properties:
        id: { type: string }
        order_number: { type: string }
        status: { type: string }
        payment_status: { type: string }
        totals: { $ref: '#/components/schemas/MoneyTotals' }
        customer_email: { type: string, format: email }
        customer_phone: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        paid_at: { type: string, format: date-time, nullable: true }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }

    OrderItem:
      type: object
      properties:
        id: { type: string }
        quantity: { type: integer }
        unit_price: { type: integer }
        discount_amount: { type: integer }
        fee_amount: { type: integer }
        total_amount: { type: integer }
        event_title: { type: string }
        session_title: { type: string, nullable: true }
        venue_title: { type: string, nullable: true }
        seat_snapshot: { type: object, additionalProperties: true, nullable: true }

    OrderResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Order' }

    OrderListResponse:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Order' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    Payment:
      type: object
      properties:
        id: { type: string }
        order_id: { type: string }
        provider: { type: string, example: yookassa }
        provider_payment_id: { type: string, nullable: true }
        amount: { type: integer }
        currency: { type: string }
        status: { type: string }
        payment_url: { type: string, format: uri, nullable: true }
        created_at: { type: string, format: date-time }
        paid_at: { type: string, format: date-time, nullable: true }

    PaymentResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Payment' }

    RefundRequest:
      type: object
      required: [amount, reason]
      properties:
        amount: { type: integer, minimum: 1 }
        reason: { type: string, maxLength: 500 }

    Refund:
      type: object
      properties:
        id: { type: string }
        order_id: { type: string }
        payment_id: { type: string }
        amount: { type: integer }
        currency: { type: string }
        reason: { type: string, nullable: true }
        status: { type: string }
        provider_refund_id: { type: string, nullable: true }

    RefundResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Refund' }

    Ticket:
      type: object
      properties:
        id: { type: string }
        ticket_number: { type: string }
        ticket_index: { type: integer, minimum: 1 }
        order_id: { type: string }
        event_id: { type: string }
        session_id: { type: string }
