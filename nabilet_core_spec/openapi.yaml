    OfflineBundle:
      type: object
      description: >-
        An offline bundle for the Android Checker (spec 43). The payload holds
        the event plus session plus valid and revoked ticket lists plus the
        public key. Ticket entries carry public ids and statuses only - the
        bundle never contains holder names or any other personal data.
      properties:
        id: { type: string }
        checkin_device_id: { type: string }
        event_id: { type: string }
        session_id: { type: string, nullable: true }
        bundle_hash: { type: string }
        schema_version: { type: integer }
        public_key_fingerprint: { type: string, nullable: true }
        ticket_count: { type: integer }
        revoked_count: { type: integer }
        payload_json: { type: object, nullable: true, additionalProperties: true }
        status: { type: string, enum: [generated, downloaded, expired, revoked] }
        generated_at: { type: string, format: date-time }
        downloaded_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }

    OfflineBundleCreate:
      type: object
      required: [event_id]
      properties:
        event_id: { type: string }
        session_id: { type: string, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }

    OfflineBundleResponse:
      type: object
      properties:
        data: { $ref: '#/components/schemas/OfflineBundle' }

    OfflineBundleListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/OfflineBundle' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

