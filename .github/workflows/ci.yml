name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here needs credentials. The checks below are deliberately runnable
# without Composer: the kernel and every verifier are dependency-free by design,
# so a broken `composer install` (or a package registry outage) cannot stop the
# invariants from being enforced. That separation is the whole point.
permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # The fast, dependency-free gate. Runs on every push.
  # ───────────────────────────────────────────────────────────────────────────
  verify:
    name: Verifiers (no Composer required)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, mbstring, openssl, pdo
          coverage: none
          tools: none

      - name: Syntax lint
        run: php tools/lint.php

      - name: Kernel test suite
        run: php tests/run.php

      # The dependency-free test suite only proves what it can load. This keeps
      # the domain loadable in the first place: one `use Illuminate\...` inside a
      # Domain/ class would still lint, and would then be untestable here — the
      # failure would surface only on a machine that has vendor/.
      - name: Domain stays free of the framework
        run: php tools/verify-purity.php

      # §1.2 of docs/CODE-QUALITY-GUIDE.md is the invariant this project broke
      # most often: an error raised with the wrong shape, or with no reason at
      # all. The ratchet is dependency-free (plain `php`, no vendor/), so there
      # is no excuse for it not being here -- yet it was the one verifier left
      # out, which is how a moved `Log::warning()` context in the HoldSweeper
      # split could have gone unnoticed. The allowlist only shrinks.
      - name: Every error body is the §66 envelope
        run: php tools/verify-error-envelope.php

      - name: Module dependency graph
        run: php tools/modules.php --validate

      - name: Migrations are equivalent to the spec bundle
        run: php tools/verify-migrations.php

      - name: State machines match the schema CHECK constraints
        run: php tools/verify-state-machines.php

      - name: OpenAPI contract (docs copy)
        run: php tools/verify-openapi.php

      - name: OpenAPI contract (spec bundle copy)
        run: php tools/verify-openapi.php nabilet_core_spec/openapi.yaml

      # The contract and the DDL describe the same world and are maintained
      # separately. Where they disagree, the API promises a field the table
      # cannot store. Known drift is listed in the tool with a reason; anything
      # new fails here.
      - name: Contract and schema agree (docs copy)
        run: php tools/verify-contract-schema.php

      - name: Contract and schema agree (spec bundle copy)
        run: php tools/verify-contract-schema.php nabilet_core_spec/openapi.yaml

      # The Eloquent layer was generated from a description of the domain rather
      # than from the DDL, and it cannot run here -- no vendor/, no reachable
      # MySQL -- so every column name in it is an untested claim. The same class
      # of mistake already shipped once, in the idempotency middleware, which read
      # `key` and `response_code`, neither of which exists.
      #
      # 88 fields are currently known to be wrong; they are listed in the tool with
      # a reason each, and that list is a ratchet -- it may only shrink. Anything
      # new fails here.
      - name: Eloquent models name real columns
        run: php tools/verify-models-schema.php

      # A namespace is a claim that a class can be found, and nothing checked that
      # claim. The tree is currently split across three roots -- 86 files say
      # `Nabilet\Modules\`, 78 say `App\Modules\`, 40 say `NabileT\Modules\` -- and
      # composer.json maps only the first, so 121 files cannot be autoloaded at all.
      # PSR-4 prefix matching is case-sensitive, which is why `NabileT\` can never
      # resolve. They are listed in the tool with a reason each, and that list is a
      # ratchet: it may only shrink, anything new fails here.
      - name: Declared namespaces can be autoloaded
        run: php tools/verify-autoload.php

      # `modules.php --validate` reads the manifests that exist, so it is blind to
      # a module directory that has none -- which is how `Carts/`, `Core/`,
      # `Content/` and `System/` ended up outside the registry. This closes that
      # gap, and checks that every class-string in config/nabilet.php matches the
      # file it names (all nine currently point at a root that cannot load).
      - name: Module directories match the registry
        run: php tools/verify-module-structure.php

      # Route registration had two owners and nothing noticed. A module provider
      # called `loadRoutesFrom()` while the same file was also required from
      # `routes/api.php`, so Payments registered an unprefixed second copy of
      # every endpoint — including the public webhook — absent from the contract
      # and outside the API middleware group. Worse, Laravel keys routes by
      # method+uri, so the two copies of `webhooks/payment/{provider}` did not
      # even reach the same controller. The opposite also happened: the Media
      # route file existed but nothing required it, so `/api/v1/media` was a 404
      # that read as a missing feature. There is no vendor/ here to run
      # `route:list`, so both directions are decided statically instead.
      - name: Routes have exactly one owner
        run: php tools/verify-route-ownership.php

      - name: Composer manifest is valid
        run: composer validate --no-check-publish --no-check-lock

  # ───────────────────────────────────────────────────────────────────────────
  # The container files, checked where Docker actually works.
  #
  # Neither the Dockerfile nor docker-compose.yml can be exercised on the machine
  # that wrote them: image pulls fail there behind an intercepting proxy
  # (`x509: certificate has expired or is not yet valid`), and the local Docker is
  # 18.09.2 with no Compose. Shipping them unvalidated is how a stack file ends up
  # referencing a service that does not exist, so here a runner does the checking.
  #
  # `docker build` IS now performed. It used to be held back because no
  # composer.lock was committed and `composer install` therefore could not resolve
  # reproducibly. The lock is committed, and the Dockerfile already prefers
  # `composer install` when it sees one, so the build is meaningful rather than a
  # test of Packagist's availability.
  #
  # The build is NOT run against the local Docker on the dev machine (see above);
  # a runner is the first place it can be attempted at all.
  # ───────────────────────────────────────────────────────────────────────────
  docker:
    name: Container files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compose file is valid
        run: docker compose config --quiet

      - name: Dockerfile lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          # `error` only: the default threshold fails on style warnings such as
          # "pin the apk version", which is noise for an internal image.
          failure-threshold: error

      # The image is actually assembled, which is the only check that proves the
      # Dockerfile is internally consistent: a COPY of a path that does not exist,
      # a missing extension the code needs at boot, an `install` against a lock
      # that cannot resolve. hadolint reads the file; this runs it.
      #
      # `docker/build-push-action` with `push: false` keeps the result in the
      # runner's local daemon and lets BuildKit cache the dependency layer, so
      # a red build here is a defect in the image rather than a slow network.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          # Fail on a lock/install mismatch instead of silently falling back —
          # the Dockerfile itself already prefers `composer install` when a lock
          # is present, and one is committed.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────────────────────────────────────────────────────────────────────
  # The authoritative check: does the DDL actually execute on MySQL 8.4?
  #
  # The verifier above proves the Laravel migrations MATCH the spec. This proves
  # the spec ITSELF runs — engine, collation, the trigger, every CHECK. That is
  # the part no amount of static analysis can substitute for.
  #
  # migrations.sql and nabilet_core_spec/migrations/*.sql are two renderings of
  # the same schema. Both are applied to separate databases and diffed, so a
  # change made to one copy and forgotten in the other fails loudly here.
  # ───────────────────────────────────────────────────────────────────────────
  schema:
    name: Apply the spec bundle to MySQL 8.4
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: nabilet
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
      - uses: actions/checkout@v4

      - name: Wait for MySQL to accept connections
        run: |
          for i in $(seq 1 60); do
            if mysql -h 127.0.0.1 -P 3306 -uroot -prootpass -e "SELECT 1" >/dev/null 2>&1; then
              echo "mysql is ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::mysql never became ready"
          exit 1

      - name: Apply the consolidated bundle
        run: mysql -h 127.0.0.1 -P 3306 -uroot -prootpass nabilet < migrations.sql

      - name: Apply the split bundle into a second database
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -prootpass \
            -e "CREATE DATABASE split CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          set -e
          for f in nabilet_core_spec/migrations/*.sql; do
            echo "applying $f"
            mysql -h 127.0.0.1 -P 3306 -uroot -prootpass split < "$f"
          done

      # These numbers are the documented shape of the schema (docs/DATABASE.md).
      # If the schema legitimately grows, update them here in the same commit —
      # that is the point: a table silently dropped from the bundle must fail.
      - name: Assert the expected object counts
        run: |
          set -e
          Q() { mysql -h 127.0.0.1 -P 3306 -uroot -prootpass -N -B -e "$1" 2>/dev/null; }
          EXPECT_TABLES=64
          EXPECT_COLUMNS=684
          EXPECT_TRIGGERS=1

          for db in nabilet split; do
            tables=$(Q "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='${db}' AND table_type='BASE TABLE';")
            cols=$(Q   "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='${db}';")
            echo "${db}: ${tables} tables, ${cols} columns"
            [ "$tables" = "$EXPECT_TABLES" ]   || { echo "::error::${db} has ${tables} tables, expected ${EXPECT_TABLES}"; exit 1; }
            [ "$cols"   = "$EXPECT_COLUMNS" ]  || { echo "::error::${db} has ${cols} columns, expected ${EXPECT_COLUMNS}"; exit 1; }
          done

          triggers=$(Q "SELECT COUNT(*) FROM information_schema.triggers WHERE trigger_schema='nabilet';")
          [ "$triggers" = "$EXPECT_TRIGGERS" ] || { echo "::error::expected ${EXPECT_TRIGGERS} trigger, found ${triggers}"; exit 1; }
          echo "triggers: ${triggers}"

      - name: Consolidated and split must agree
        run: |
          set -e
          COLS="SELECT table_name, column_name, ordinal_position, column_type, is_nullable,
                       COALESCE(column_default,''), column_key, extra
                FROM information_schema.columns WHERE table_schema='%s'
                ORDER BY table_name, ordinal_position;"
          mysql -h 127.0.0.1 -P 3306 -uroot -prootpass -N -B -e "$(printf "$COLS" nabilet)" 2>/dev/null > /tmp/consolidated.tsv
          mysql -h 127.0.0.1 -P 3306 -uroot -prootpass -N -B -e "$(printf "$COLS" split)"    2>/dev/null > /tmp/split.tsv
          if ! diff -u /tmp/consolidated.tsv /tmp/split.tsv; then
            echo "::error::migrations.sql and the split set produce different schemas"
            exit 1
          fi
          echo "consolidated == split ($(wc -l < /tmp/consolidated.tsv) columns)"

      # The trigger is the one integrity rule MySQL cannot express as a CHECK
      # (a CHECK cannot reference OLD). It is also the easiest thing in the world
      # to break silently, so assert both directions: a frozen version cannot be
      # mutated, and a draft still can.
      - name: The immutability trigger actually fires
        run: |
          set -e
          MY="mysql -h 127.0.0.1 -P 3306 -uroot -prootpass nabilet"

          $MY <<'SQL'
          INSERT INTO organizations (id, public_id, name, slug, status, created_at, updated_at)
            VALUES (1, 'org_test_aaaaaaaaaaaaaaaaa', 'T', 't', 'active', NOW(6), NOW(6));
          INSERT INTO venues (id, public_id, organization_id, name, slug, created_at, updated_at)
            VALUES (1, 'ven_test_aaaaaaaaaaaaaaaaa', 1, 'V', 'v', NOW(6), NOW(6));
          INSERT INTO halls (id, public_id, venue_id, name, created_at, updated_at)
            VALUES (1, 'hal_test_aaaaaaaaaaaaaaaaa', 1, 'H', NOW(6), NOW(6));
          INSERT INTO hall_schema_versions (id, public_id, hall_id, version, status, schema_json, created_at, updated_at)
            VALUES (1, 'hsv_test_aaaaaaaaaaaaaaaaa', 1, 1, 'published', '{}', NOW(6), NOW(6));
          SQL

          # Negative: mutating the payload of a published version must be rejected.
          set +e
          $MY -e "UPDATE hall_schema_versions SET schema_json = '{\"changed\":true}' WHERE id = 1;" 2>/tmp/trigger.err
          code=$?
          set -e
          [ "$code" -ne 0 ] || { echo "::error::a published schema version was mutated — the trigger did not fire"; exit 1; }
          grep -q "immutable" /tmp/trigger.err || { echo "::error::failed for an unrelated reason: $(cat /tmp/trigger.err)"; exit 1; }
          echo "published payload is immutable"

          # Negative: renumbering a frozen version must be rejected too.
          set +e
          $MY -e "UPDATE hall_schema_versions SET version = 2 WHERE id = 1;" 2>/dev/null
          code=$?
          set -e
          [ "$code" -ne 0 ] || { echo "::error::a published version was renumbered — the trigger did not fire"; exit 1; }
          echo "published version number is immutable"

          # Positive: publishing/archiving is a status change and must still work,
          # otherwise the trigger would freeze the table permanently.
          $MY -e "UPDATE hall_schema_versions SET status = 'archived' WHERE id = 1;"
          echo "status transitions still allowed"

          # Positive: a draft is still freely editable.
          $MY <<'SQL'
          INSERT INTO hall_schema_versions (id, public_id, hall_id, version, status, schema_json, created_at, updated_at)
            VALUES (2, 'hsv_draft_aaaaaaaaaaaaaaaa', 1, 2, 'draft', '{}', NOW(6), NOW(6));
          UPDATE hall_schema_versions SET schema_json = '{"draft":true}' WHERE id = 2;
          SQL
          echo "draft versions remain editable"

  # ───────────────────────────────────────────────────────────────────────────
  # The PHP test suite, against a real MySQL 8.4.
  #
  # This is where the application layer is actually exercised. The `verify` job
  # reads code without ever running it, which is exactly how a controller calling
  # a method that does not exist (`UserService::sendPasswordResetLink()`), or one
  # reading a protected property, shipped as a 500 on every request and was
  # caught only by hand. Nothing in the static set can see either.
  #
  # `RefreshDatabase` drops and rebuilds every table on each run, so the database
  # is disposable by construction and this job must never point at anything else.
  # phpunit.xml already forces the DB_* values, so an inherited shell variable
  # cannot redirect `migrate:fresh` to a different database — the service below
  # is only here to satisfy those forced values.
  # ───────────────────────────────────────────────────────────────────────────
  phpunit:
    name: PHP test suite
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: nabilet_test_suite
        ports:
          # phpunit.xml pins 3307; a runner has no other MySQL, but keeping the
          # port identical to the documented local setup means the same file works
          # in both places without a CI-only branch.
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
      - uses: actions/checkout@v4

      # Extensions mirror composer.json's `require` (json, mbstring, openssl,
      # pdo) plus pdo_mysql, without which the suite cannot connect at all.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, mbstring, openssl, pdo, pdo_mysql
          coverage: none
          tools: none

      # `composer.lock` is committed, so this resolves to an exact, reproducible
      # set. `--no-scripts` because `post-autoload-dump` runs `package:discover`,
      # which boots the app and needs a reachable database; the autoloader is
      # dumped explicitly instead.
      - name: Validate the lock is in sync with composer.json
        run: composer validate --no-check-publish --strict

      - name: Install dependencies from the lock
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Dump the autoloader
        run: composer dump-autoload --optimize --no-scripts

      # `phpunit.xml` forces DB_HOST=127.0.0.1 / DB_PORT=3307 / DB_DATABASE=
      # nabilet_test_suite / root / rootpass with force="true", so the suite
      # itself cannot be redirected. But `artisan key:generate` below BOOTS the
      # application, and a boot reads `.env` — where the shipped defaults point at
      # port 3306 and a `nabilet` user that does not exist in this job. Writing the
      # service's coordinates into `.env` keeps the boot working without touching
      # the file that actually governs the tests.
      - name: Point the environment file at the CI database
        run: |
          cp .env.example .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/'     .env
          sed -i 's/^DB_PORT=.*/DB_PORT=3307/'          .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=nabilet_test_suite/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=root/'  .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=rootpass/' .env
          grep -E '^DB_(HOST|PORT|DATABASE|USERNAME)=' .env

      - name: Generate an application key
        run: php artisan key:generate --ansi

      # The immutability trigger in migration 2026_10_06_000100 needs SUPER (or
      # this flag) to be created, and MySQL refuses it otherwise with ERROR 1419.
      # The migration is fail-soft, so without this the suite would pass while
      # silently testing a database that lacks the trigger.
      - name: Allow trigger creation without SUPER
        run: |
          mysql -h 127.0.0.1 -P 3307 -uroot -prootpass \
            -e "SET GLOBAL log_bin_trust_function_creators = 1;"

      - name: Run the test suite
        run: php vendor/bin/phpunit

  # ───────────────────────────────────────────────────────────────────────────
  # The frontend: types, unit tests, and a real bundle.
  #
  # `vue-tsc` is the only thing that reads the .vue templates and the typed
  # store/api layer, so a broken prop or a missing `v-model` binding is invisible
  # to every PHP-side check. `vite build` is separate from it on purpose: a file
  # can typecheck and still fail to bundle (a bad import path, a circular
  # dependency), and the failure mode is a blank page in production.
  #
  # The build is also what proves the router's dynamic imports resolve. Every
  # admin page is `() => import(...)`, so a renamed or deleted component is a
  # runtime 404 rather than a compile error — which is exactly how the deleted
  # `AdminPlaceholderPage.vue` would have surfaced if the catch-all still pointed
  # at it.
  # ───────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `package-lock.json` is committed, so `npm ci` installs the exact tree
      # rather than resolving ranges and drifting from what was tested locally.
      - name: Install dependencies from the lock
        run: npm ci --no-audit --no-fund

      - name: Type-check the SPA
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      # The build output is what nginx actually serves. If it is missing, every
      # other check can be green while the deployed site is blank.
      - name: The bundle was emitted
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html was not produced"; exit 1; }
          test -d dist/assets || { echo "::error::dist/assets was not produced"; exit 1; }
          echo "built: $(find dist/assets -name '*.js' | wc -l) JS chunks, $(find dist/assets -name '*.css' | wc -l) CSS files"
