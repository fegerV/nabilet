<!DOCTYPE html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      Оболочка витрины для тестов. НЕ артефакт сборки и НЕ копия собранного
      index.html из каталога dist.

      Страница события отдаётся как собранная витрина, в которую
      EventPageController::renderSpaShell() вставляет серверный SEO-блок.
      Сборки в PHP-задании CI нет (каталог dist не хранится в git, а собирает
      его отдельное задание), поэтому тестам нужна оболочка, которая есть
      всегда и везде.

      Воспроизведён ровно тот контракт, на который опирается вставка, и ничего
      сверх него:

        • заголовок в теге title            — подменяется на заголовок события;
        • метатег описания                  — подменяется на описание события;
        • закрывающий тег головной секции   — перед ним вставляется canonical,
                                              og и JSON-LD;
        • пустой контейнер приложения       — внутрь него кладётся видимый текст.

      ВАЖНО: в этом комментарии эти четыре конструкции намеренно НЕ написаны
      буквально. Вставка ищет их по тексту документа, поэтому упоминание
      «закрывающего тега головной секции» внутри комментария заставило бы её
      вставить блок ещё раз — в комментарий. Разметка ниже повторяет корневой
      index.html (входной файл Vite), но без ссылок на ресурсы: их имена
      содержат хеш сборки и устарели бы в первом же коммите.

      Отсутствие любой из четырёх конструкций в НАСТОЯЩЕЙ сборке ловит задание
      фронтенда — единственное место, где сборка существует.
    -->
    <meta name="description" content="NABILET — билеты на события: выбор мест на схеме зала, оплата и QR-билет." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NABILET" />
    <title>NABILET — билеты на события</title>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
