; NABILET Core — OPcache settings for the FPM runtime.
;
; `validate_timestamps=0` is the production setting: PHP never stats the file
; system to check whether a script changed, which is a measurable win on a request
; path that touches dozens of files. The cost is that a new deploy MUST recycle the
; FPM workers — otherwise the old bytecode keeps running and the release appears to
; do nothing. That is why the compose file restarts `app` on deploy rather than
; replacing files underneath it.

opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.jit_buffer_size=0
