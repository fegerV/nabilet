<!DOCTYPE html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!-- Иконка вкладки. Без неё браузер запрашивает /favicon.ico, получает 404
         и рисует пустой лист — а витрину обычно держат открытой в нескольких
         вкладках (каталог, страница события, схема зала). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Ссылки для iOS: при «Добавить на экран Домой» Safari берёт иконку отсюда,
         а не из favicon. Проект заявлен как PWA, поэтому это не украшение. -->
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="description" content="NABILET — билеты на события: выбор мест на схеме зала, оплата и QR-билеты." />
    <!-- Open Graph для корня витрины.
         У страниц событий эти теги подставляет `EventPageController` с реальными
         данными, а у `/` они нужны для ссылки на сам каталог.

         ВНИМАНИЕ: контроллер события вставляет свой og-блок ПОСЛЕ этого.
         Поэтому ни один тег отсюда он не переопределяет, а ДОБАВЛЯЕТ второй —
         и парсеры берут последнее вхождение. Для `og:image` это работало бы
         случайно, потому что относительный путь здесь и абсолютный там
         указывают на один файл. Дешевле не полагаться на порядок: держим
         здесь только те поля, которые у события совпадают с корнем
         (`og:type`, `og:site_name`), и не задаём `og:image` — иначе на
         странице события оказывается два тега с разными значениями, и какое
         превью построит конкретный мессенджер, зависит от его парсера. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NABILET" />
    <meta property="og:title" content="NABILET — билеты на события" />
    <meta property="og:description" content="Выбор мест на схеме зала, оплата онлайн, QR-билет на почту." />
    <title>NABILET — билеты на события</title>
    <script>
      /* Тема применяется до первой отрисовки: иначе интерфейс мигает светлым. */
      (function () {
        try {
          var stored = localStorage.getItem('nabilet.theme')
          var dark = stored === 'dark' || ((!stored || stored === 'auto') && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/resources/js/main.ts"></script>
  </body>
</html>
